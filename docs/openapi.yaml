      parameters:
        - { name: bulan, in: query, description: Default bulan ini, schema: { type: string, example: "2026-10" } }
      responses:
        "200":
          description: Ringkasan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DasborRingkasan" }
        "400": { $ref: "#/components/responses/Error" }

  /api/dasbor/ringkasan/pdf:
    get:
      tags: [Dasbor Lintas Modul]
      summary: Unduh rekap kepegawaian (PDF, B2)
      parameters:
        - { name: bulan, in: query, schema: { type: string, example: "2026-10" } }
      responses:
        "200":
          description: Berkas PDF
          content:
            application/pdf: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/Error" }

  /api/dasbor/pengajuan/ekspor:
    get:
      tags: [Dasbor Lintas Modul]
      summary: Unduh rekap pengajuan (CSV)
      description: |
        Tombol "Unduh rekap" di antrean Cuti, Pensiun, Kenaikan Pangkat, Sikap Disiplin, dan Layanan Dapodik: isi
        `GET /api/dasbor/pengajuan` dengan saringan yang sama, maksimal 5.000 baris. Mengikuti scope akun; kolom pegawai
        kosong untuk Sikap Disiplin bila pengunduh adalah pimpinan.
      parameters:
        - { name: modul, in: query, description: Dipisah koma, schema: { type: string, example: "cuti" } }
        - { name: kelompok, in: query, schema: { type: string, enum: [perlu_perbaikan, menunggu_surat_fisik, diproses, selesai] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: "Berkas CSV: modul, nomor, pegawai, sekolah, status, kelompok, diajukan, diperbarui"
          content:
            text/csv: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }

  /api/dasbor/pengingat-tenggat:
    post:
      tags: [Dasbor Lintas Modul]
      summary: Jalankan pengingat tenggat terlewat sekarang
      description: |
        Hanya `admin`. Aplikasi menjalankan ini sendiri setiap hari pukul 08.00 WIB (matikan dengan `PENGINGAT_TENGGAT=false`).
        Setiap staf Sudin, pimpinan, dan operator aktif menerima notifikasi "Tenggat terlewat" untuk tugas di
        `GET /api/dasbor/tugas` miliknya yang sudah lewat tenggat. Tugas yang sama diingatkan lagi paling cepat 7 hari kemudian.
      responses:
        "200":
          description: Jumlah notifikasi yang dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          terkirim: { type: integer, example: 3 }
        "403": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }

  responses:
    Ok:
      description: Berhasil
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Response" }
    Error:
      description: Gagal. `error` berisi alasan yang bisa ditampilkan ke pengguna.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Response:
      type: object
      properties:
        status: { type: boolean, example: true }
        message: { type: string }
        data: {}
    ErrorResponse:
      type: object
      properties:
        status: { type: boolean, example: false }
        message: { type: string, example: gagal mengajukan cuti }
        error: { type: string, example: sisa cuti tahunan 2026 hanya 2 hari kerja }
    Paginated:
      type: object
      properties:
        code: { type: integer, example: 200 }
        status: { type: string, example: success }
        message: { type: string }
        data: { type: array, items: {} }
        pagination:
          type: object
          properties:
            page: { type: integer }
            per_page: { type: integer }
            max_page: { type: integer }
            total: { type: integer }

    Token:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Role:
      type: string
      enum: [staf_sudin, operator_sekolah, pimpinan, admin]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        username: { type: [string, "null"] }
        nip: { type: [string, "null"] }
        email: { type: string }
        telp_number: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        is_aktif: { type: boolean }
        sudin_id: { type: [string, "null"], format: uuid }
        sudin_nama: { type: string, example: Jakarta Barat }
        sekolah_id: { type: [string, "null"], format: uuid }
        sekolah_nama: { type: string, example: SMP Negeri 45 Jakarta }

    Sudin:
      type: object
      properties:
        id: { type: string, format: uuid }
        kode: { type: string, example: JB }
        nama: { type: string, example: Jakarta Barat }
        kontak_unit: { type: string, example: Subbagian Umum dan Kepegawaian }
        kontak_telepon: { type: string, example: "(021) 5550 0145" }
        kontak_email: { type: string }
        jam_layanan: { type: string, example: "Senin-Jumat, 08.00-16.00" }

    Sekolah:
      type: object
      properties:
        id: { type: string, format: uuid }
        sudin_id: { type: string, format: uuid }
        npsn: { type: string, example: "20101045" }
        nama: { type: string, example: SMP Negeri 45 Jakarta }
        jenjang: { type: string, enum: [SD, SMP, SMA, SMK, SLB] }
        kecamatan: { type: string, example: Kebon Jeruk }
        alamat: { type: string }
        kepala_sekolah: { type: string, example: "Drs. Sutrisno Wibowo, M.Pd." }
        sudin: { $ref: "#/components/schemas/Sudin" }

    StatusKepegawaian:
      type: string
      enum: [PNS, PPPK, PPPK_PW, KKI]

    PendidikRequest:
      type: object
      required: [sekolah_id, nama, status_kepegawaian]
      properties:
        sekolah_id: { type: string, format: uuid }
        nama: { type: string, example: "Siti Rahmawati, S.Pd." }
        nip: { type: [string, "null"], pattern: "^[0-9]{18}$", example: "198706142010012015" }
        nik: { type: string, pattern: "^[0-9]{16}$" }
        nuptk: { type: string, pattern: "^[0-9]{16}$" }
        nrk: { type: string }
        nikki: { type: string }
        status_kepegawaian: { $ref: "#/components/schemas/StatusKepegawaian" }
        pangkat: { type: string, example: Penata }
        golongan: { type: string, example: III/c }
        jabatan: { type: string, example: Guru Mapel }
        jabatan_dapodik: { type: string, example: IPA }
        program_studi: { type: string }
        sertifikasi: { type: string }
        email: { type: string, format: email }
        telepon: { type: string }
        alamat_domisili: { type: string }
        kota_domisili: { type: string }

    Pendidik:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
            sekolah: { $ref: "#/components/schemas/Sekolah" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        - $ref: "#/components/schemas/PendidikRequest"

    Notifikasi:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        judul: { type: string, example: Berkas cuti perlu perbaikan }
        pesan: { type: string }
        tautan: { type: string, example: /cuti/5c2f6a8e-0000-0000-0000-000000000000 }
        dibaca_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    JenisCuti:
      type: string
      enum: [tahunan, besar, sakit, melahirkan, alasan_penting, di_luar_tanggungan_negara]

    StatusCuti:
      type: string
      enum: [diajukan, perlu_perbaikan, menunggu_surat_fisik, diproses_sudin, disetujui, ditolak]

    Dokumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        nama_asli: { type: string, example: Permohonan_cuti_Siti_Rahmawati.pdf }
        mime_type: { type: string, example: application/pdf }
        ukuran: { type: integer, example: 1258291 }
        url: { type: string, example: /api/dokumen/5c2f6a8e-0000-0000-0000-000000000000 }

    Cuti:
      type: object
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, example: CUT-2026-0142 }
        status: { $ref: "#/components/schemas/StatusCuti" }
        jenis: { $ref: "#/components/schemas/JenisCuti" }
        tanggal_mulai: { type: string, format: date }
        tanggal_selesai: { type: string, format: date }
        hari_kerja: { type: integer, example: 5 }
        alasan: { type: string }
        disetujui_kepsek: { type: boolean }
        pendidik:
          type: object
          properties:
            id: { type: string, format: uuid }
            nama: { type: string }
            nip: { type: [string, "null"] }
            status_kepegawaian: { $ref: "#/components/schemas/StatusKepegawaian" }
            pangkat: { type: string }
            golongan: { type: string }
            jabatan: { type: string }
        sekolah:
          type: object
          properties:
            id: { type: string, format: uuid }
            npsn: { type: string }
            nama: { type: string }
        berkas_permohonan: { $ref: "#/components/schemas/Dokumen" }
        berkas_lengkap: { type: [boolean, "null"] }
        berkas_terbaca: { type: [boolean, "null"] }
        catatan_perbaikan: { type: string }
        diperiksa_at: { type: [string, "null"], format: date-time }
        surat_fisik_diterima_tanggal: { type: [string, "null"], format: date }
        surat_fisik_penerima_nama: { type: string }
        nota_dinas_ada: { type: [boolean, "null"] }
        catatan_penerimaan: { type: string }
        nomor_surat_izin: { type: string }
        tanggal_surat_izin: { type: [string, "null"], format: date }
        surat_izin: { $ref: "#/components/schemas/Dokumen" }
        catatan_keputusan: { type: string }
        diputuskan_at: { type: [string, "null"], format: date-time }
        riwayat:
          type: array
          description: Hanya di endpoint detail, urut dari yang terlama
          items:
            type: object
            properties:
              dari_status: { type: string }
              ke_status: { $ref: "#/components/schemas/StatusCuti" }
              oleh: { type: string, format: uuid }
              oleh_nama: { type: string }
              catatan: { type: string }
              created_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # fragmen: pensiun
    PensiunStatus:
      type: string
      enum: [diajukan, perlu_perbaikan, terverifikasi, diusulkan_ke_bkd, selesai]

    PensiunJenis:
      type: string
      enum: [batas_usia, atas_permintaan_sendiri]

    PensiunJenisBerkas:
      type: object
      properties:
        kode: { type: string, example: sk_cpns }
        label: { type: string, example: SK CPNS }
        kelompok: { type: string, example: Kepegawaian }

    PensiunPenilaian:
      type: object
      required: [jenis, valid]
      properties:
        jenis: { type: string, maxLength: 40, example: skp_terakhir }
        valid: { type: boolean }
        catatan:
          type: string
          maxLength: 1000
          description: Wajib bila `valid` false
          example: Halaman tanda tangan pejabat penilai belum ada. Unggah SKP 2025 yang lengkap.

    PensiunBerkas:
      type: object
      properties:
        jenis: { type: string, example: skp_terakhir }
        label: { type: string, example: SKP tahun terakhir }
        kelompok: { type: string, example: Kepegawaian }
        dokumen: { $ref: "#/components/schemas/Dokumen" }
        valid: { type: [boolean, "null"], description: null = belum dinilai }
        catatan: { type: string, description: Alasan tidak valid }
        dinilai_at: { type: [string, "null"], format: date-time }

    PensiunPendidik:
      type: object
      properties:
        id: { type: string, format: uuid }
        nama: { type: string, example: "Ahmad Fauzi, S.Pd." }
        nip: { type: [string, "null"], example: "196703051990031007" }
        status_kepegawaian: { $ref: "#/components/schemas/StatusKepegawaian" }
        pangkat: { type: string, example: Pembina }
        golongan: { type: string, example: IV/a }
        jabatan: { type: string }
        tanggal_lahir: { type: [string, "null"], format: date, example: "1967-03-05" }
        tmt_cpns: { type: [string, "null"], format: date, example: "1990-03-01" }
        tmt_golongan: { type: [string, "null"], format: date, example: "2023-04-01", description: TMT golongan sekarang; dipakai syarat 4 tahun kenaikan pangkat dan diperbarui otomatis saat SK KP dicatat }

    PensiunMasaKerja:
      type: [object, "null"]
      description: Dari TMT CPNS sampai TMT pensiun; null bila TMT CPNS belum diisi
      properties:
        tahun: { type: integer, example: 37 }
        bulan: { type: integer, example: 1 }

    PensiunPerkiraan:
      type: object
      properties:
        pendidik: { $ref: "#/components/schemas/PensiunPendidik" }
        sekolah:
          type: object
          properties:
            id: { type: string, format: uuid }
            npsn: { type: string }
            nama: { type: string }
        batas_usia: { type: integer, example: 60 }
        tmt_pensiun_bup: { type: [string, "null"], format: date, example: "2027-04-01" }
        masa_kerja: { $ref: "#/components/schemas/PensiunMasaKerja" }
        pengajuan_nomor: { type: [string, "null"], example: PEN-2026-0031 }
        jumlah_berkas_wajib: { type: integer, example: 14 }
        kendala:
          type: array
          description: Alasan pendidik belum bisa diajukan; kosong = bisa
          items: { type: string }
          example: []

    PensiunPengajuan:
      type: object
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, example: PEN-2026-0031 }
        status: { $ref: "#/components/schemas/PensiunStatus" }
        jenis: { $ref: "#/components/schemas/PensiunJenis" }
        tmt_pensiun: { type: string, format: date, example: "2027-04-01" }
        masa_kerja: { $ref: "#/components/schemas/PensiunMasaKerja" }
        pendidik: { $ref: "#/components/schemas/PensiunPendidik" }
        sekolah:
          type: object
          properties:
            id: { type: string, format: uuid }
            npsn: { type: string }
            nama: { type: string }
        jumlah_berkas: { type: integer, example: 14 }
        berkas_tidak_valid: { type: integer, example: 1 }
        berkas:
          type: array
          description: Hanya di detail dan respons aksi, urut seperti daftar persyaratan
          items: { $ref: "#/components/schemas/PensiunBerkas" }
        diverifikasi_at: { type: [string, "null"], format: date-time }
        nomor_surat_pengantar: { type: string, example: 800.1.6.1/2214/SDP.I/XI/2026 }
        tanggal_kirim: { type: [string, "null"], format: date }
        cara_kirim: { type: string }
        bukti_kirim: { $ref: "#/components/schemas/Dokumen" }
        catatan_kirim: { type: string }
        nomor_sk: { type: string, example: 882/3215/BKD/2026 }
        tanggal_sk: { type: [string, "null"], format: date }
        sk: { $ref: "#/components/schemas/Dokumen" }
        selesai_at: { type: [string, "null"], format: date-time }
        riwayat:
          type: array
          description: Hanya di detail, urut dari yang terlama
          items:
            type: object
            properties:
              dari_status: { type: string }
              ke_status: { $ref: "#/components/schemas/PensiunStatus" }
              oleh: { type: string, format: uuid }
              oleh_nama: { type: string }
              catatan: { type: string }
              created_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # fragmen: kenaikan_pangkat
    KenaikanPangkatStatus:
      type: string
      enum: [diajukan, perlu_perbaikan, terverifikasi, diusulkan_ke_bkd, selesai]

    KenaikanPangkatJenisBerkas:
      type: object
      properties:
        kode: { type: string, example: pak }
        label: { type: string, example: PAK (Penetapan Angka Kredit) }
        kelompok: { type: string, example: Persyaratan }

    KenaikanPangkatPenilaian:
      type: object
      required: [jenis, valid]
      properties:
        jenis: { type: string, maxLength: 40, example: skp_2_tahun }
        valid: { type: boolean }
        catatan:
          type: string
          maxLength: 1000
          description: Wajib bila `valid` false
          example: SKP tahun 2025 belum ditandatangani pejabat penilai.

    KenaikanPangkatBerkas:
      type: object
      properties:
        jenis: { type: string, example: pak }
        label: { type: string, example: PAK (Penetapan Angka Kredit) }
        kelompok: { type: string }
        dokumen: { $ref: "#/components/schemas/Dokumen" }
        valid: { type: [boolean, "null"], description: null = belum dinilai }
        catatan: { type: string, description: Alasan tidak valid }
        dinilai_at: { type: [string, "null"], format: date-time }

    KenaikanPangkatPendidik:
      type: object
      properties:
        id: { type: string, format: uuid }
        nama: { type: string, example: "Dewi Anggraini, S.Pd.Gr." }
        nip: { type: [string, "null"], example: "199009212015032004" }
        status_kepegawaian: { $ref: "#/components/schemas/StatusKepegawaian" }
        pangkat: { type: string, example: Penata Muda Tk. I }
        golongan: { type: string, example: III/b }
        jabatan: { type: string, example: Guru Ahli Pertama }

    KenaikanPangkatPerkiraan:
      type: object
      properties:
        pendidik: { $ref: "#/components/schemas/KenaikanPangkatPendidik" }
        sekolah:
          type: object
          properties:
            id: { type: string, format: uuid }
            npsn: { type: string }
            nama: { type: string }
        periode: { type: string, example: "2027-04" }
        pangkat_lama: { type: string, example: Penata Muda Tk. I }
        golongan_lama: { type: string, example: III/b }
        pangkat_baru: { type: string, example: Penata }
        golongan_baru: { type: string, example: III/c }
        pengajuan_nomor: { type: [string, "null"], description: Usulan yang belum selesai, bila ada }
        jumlah_berkas_wajib: { type: integer, example: 6 }
        kendala:
          type: array
          description: Alasan pendidik belum bisa diusulkan; kosong = bisa
          items: { type: string }
          example: []
        tmt_golongan: { type: [string, "null"], format: date, description: Null bila belum diisi di data induk }
        masa_kerja_golongan:
          oneOf:
            - $ref: "#/components/schemas/MasaKerjaGolongan"
            - type: "null"

    MasaKerjaGolongan:
      type: object
      description: Masa kerja di golongan sekarang, dihitung sampai tanggal periode KP.
      properties:
        tahun: { type: integer, example: 4 }
        bulan: { type: integer, example: 0 }

    KenaikanPangkatPengajuan:
      type: object
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, example: KP-2026-0118 }
        status: { $ref: "#/components/schemas/KenaikanPangkatStatus" }
        periode: { type: string, example: "2027-04" }
        pangkat_lama: { type: string, example: Penata Muda Tk. I }
        golongan_lama: { type: string, example: III/b }
        pangkat_baru: { type: string, example: Penata }
        golongan_baru: { type: string, example: III/c }
        pendidik: { $ref: "#/components/schemas/KenaikanPangkatPendidik" }
        sekolah:
          type: object
          properties:
            id: { type: string, format: uuid }
            npsn: { type: string }
            nama: { type: string }
        jumlah_berkas: { type: integer, example: 6 }
        berkas_tidak_valid: { type: integer, example: 0 }
        berkas:
          type: array
          description: Hanya di detail dan respons aksi, urut seperti daftar persyaratan
          items: { $ref: "#/components/schemas/KenaikanPangkatBerkas" }
        diverifikasi_at: { type: [string, "null"], format: date-time }
        nomor_surat_pengantar: { type: string, example: 0045/KP.02.03/2027 }
        tanggal_kirim: { type: [string, "null"], format: date }
        cara_kirim: { type: string }
        bukti_kirim: { $ref: "#/components/schemas/Dokumen" }
        catatan_kirim: { type: string }
        nomor_sk: { type: string, example: KP.1342/BKD/III/2027 }
        tanggal_sk: { type: [string, "null"], format: date }
        tmt_pangkat: { type: [string, "null"], format: date, example: "2027-04-01" }
        sk: { $ref: "#/components/schemas/Dokumen" }
        selesai_at: { type: [string, "null"], format: date-time }
        riwayat:
          type: array
          description: Hanya di detail, urut dari yang terlama
          items:
            type: object
            properties:
              dari_status: { type: string }
              ke_status: { $ref: "#/components/schemas/KenaikanPangkatStatus" }
              oleh: { type: string, format: uuid }
              oleh_nama: { type: string }
              catatan: { type: string }
              created_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # fragmen: disiplin
    DisiplinStatus:
      type: string
      enum: [registrasi, perlu_kelengkapan, pemeriksaan, menunggu_keputusan, sanksi_ditetapkan, tindak_lanjut, selesai, tidak_dilanjutkan]

    DisiplinJenisPelanggaran:
      type: string
      description: Ringkasan kewajiban/larangan PP 94/2021 (asumsi, lihat NOTES).
      enum: [ketidakhadiran, jam_kerja, target_kinerja, penyalahgunaan_wewenang, gratifikasi, netralitas, barang_milik_negara, lainnya]

    DisiplinTingkat:
      type: string
      enum: [ringan, sedang, berat]

    DisiplinJenisHukuman:
      type: string
      description: |
        PP 94/2021 Pasal 8. Ringan: `teguran_lisan`, `teguran_tertulis`, `pernyataan_tidak_puas`.
        Sedang: `potong_tukin_6_bulan`, `potong_tukin_9_bulan`, `potong_tukin_12_bulan` (25%).
        Berat: `penurunan_jabatan`, `pembebasan_jabatan` (12 bulan), `pemberhentian`.
      enum: [teguran_lisan, teguran_tertulis, pernyataan_tidak_puas, potong_tukin_6_bulan, potong_tukin_9_bulan, potong_tukin_12_bulan, penurunan_jabatan, pembebasan_jabatan, pemberhentian]

    DisiplinKontak:
      type: object
      properties:
        nama: { type: string, example: Bimo Rajendra }
        email: { type: string, example: staf.jb@teralur.test }

    DisiplinBerkas:
      type: object
      properties:
        id: { type: string, format: uuid, description: id dokumen }
        jenis:
          type: string
          enum: [bukti_awal, bukti_pendukung, kelengkapan, bap, tanggapan_pegawai, bukti_tambahan, salinan_keputusan, bukti_penyampaian, laporan_pelaksanaan]
        nama_asli: { type: string, example: BAP-DSP-2026-0007.pdf }
        mime_type: { type: string, example: application/pdf }
        ukuran: { type: integer }
        url: { type: string, example: /api/disiplin/5c2f6a8e-0000-0000-0000-000000000000/dokumen/7d1e0000-0000-0000-0000-000000000000 }
        created_at: { type: string, format: date-time }

    DisiplinKasus:
      type: object
      description: |
        Untuk `operator_sekolah`, field `pemeriksaan`, `rekomendasi`, `keputusan_pimpinan`, `tindak_lanjut`,
        `riwayat_hukuman`, butir daftar periksa verifikasi, dan berkas internal tidak dikirim; `catatan` riwayat hanya
        terisi untuk transisi yang ditujukan ke sekolah. Di daftar (`GET /api/disiplin`) hanya ringkasan yang dikirim,
        dan untuk `pimpinan` tanpa `pendidik` (identitas guru hanya di halaman kasus, Figma B1).
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, example: DSP-2026-0007 }
        status: { $ref: "#/components/schemas/DisiplinStatus" }
        tahap: { type: string, example: Rekomendasi hukuman, description: Label tahap untuk rekap DS9 }
        tenggat: { type: [string, "null"], format: date, description: Tenggat tahap berjalan }
        jenis_pelanggaran: { $ref: "#/components/schemas/DisiplinJenisPelanggaran" }
        jenis_pelanggaran_label: { type: string, example: Ketidakhadiran tanpa keterangan }
        uraian: { type: string }
        kronologi:
          type: array
          items:
            type: object
            properties:
              tanggal: { type: string, format: date, example: "2026-03-13" }
              kejadian: { type: string, example: Tidak hadir tanpa keterangan 3 hari kerja }
        pendidik:
          type: object
          properties:
            id: { type: string, format: uuid }
            nama: { type: string }
            nip: { type: [string, "null"] }
            status_kepegawaian: { $ref: "#/components/schemas/StatusKepegawaian" }
            pangkat: { type: string }
            golongan: { type: string }
            jabatan: { type: string }
        sekolah:
          type: object
          properties:
            id: { type: string, format: uuid }
            npsn: { type: string }
            nama: { type: string }
        pelapor: { $ref: "#/components/schemas/DisiplinKontak" }
        berkas:
          type: array
          items: { $ref: "#/components/schemas/DisiplinBerkas" }
        verifikasi:
          type: object
          properties:
            keputusan: { type: string, enum: [layak, perlu_kelengkapan, tidak_layak] }
            catatan: { type: string, description: Daftar kekurangan atau alasan tidak layak }
            batas_kelengkapan: { type: [string, "null"], format: date }
            identitas_sesuai: { type: boolean }
            kronologi_jelas: { type: boolean }
            bukti_memadai: { type: boolean }
            dalam_kewenangan: { type: boolean }
            oleh: { $ref: "#/components/schemas/DisiplinKontak" }
            at: { type: [string, "null"], format: date-time }
        tanggapan_sekolah: { type: string }
        dilengkapi_at: { type: [string, "null"], format: date-time }
        pemeriksaan:
          type: object
          properties:
            nomor_surat_panggilan: { type: string, example: e-0412/KP.03.02 }
            waktu_pemeriksaan: { type: [string, "null"], format: date-time }
            ringkasan_pemeriksaan: { type: string }
        rekomendasi:
          type: object
          properties:
            ringkasan_fakta: { type: string }
            dugaan_terbukti: { type: string }
            dasar_hukum: { type: string }
            tingkat: { $ref: "#/components/schemas/DisiplinTingkat" }
            jenis_hukuman: { $ref: "#/components/schemas/DisiplinJenisHukuman" }
            jenis_hukuman_label: { type: string }
            justifikasi: { type: string }
            oleh: { $ref: "#/components/schemas/DisiplinKontak" }
            at: { type: [string, "null"], format: date-time }
        keputusan_pimpinan:
          type: object
          properties:
            keputusan: { type: string, enum: [setujui, ubah, kembalikan] }
            catatan: { type: string }
            oleh: { $ref: "#/components/schemas/DisiplinKontak" }
            at: { type: [string, "null"], format: date-time }
        hukuman:
          type: object
          description: Terisi sejak pimpinan menetapkan sanksi; data surat keputusan terisi setelah dicatat Sudin.
          properties:
            tingkat: { $ref: "#/components/schemas/DisiplinTingkat" }
            jenis_hukuman: { $ref: "#/components/schemas/DisiplinJenisHukuman" }
            jenis_hukuman_label: { type: string, example: Pemotongan tunjangan kinerja 25% selama 6 bulan }
            nomor_keputusan: { type: string, example: e-0587/KP.04.01 }
            tanggal_keputusan: { type: [string, "null"], format: date }
            masa_mulai: { type: [string, "null"], format: date }
            masa_selesai: { type: [string, "null"], format: date }
        tindak_lanjut:
          type: object
          properties:
            tanggal_diterima_pegawai: { type: [string, "null"], format: date }
            dicatat_idis: { type: boolean }
            idis_oleh: { $ref: "#/components/schemas/DisiplinKontak" }
            idis_at: { type: [string, "null"], format: date-time }
            upaya_administratif: { type: string, enum: ["", tidak_ada, ada] }
            catatan_upaya: { type: string }
            ditutup_at: { type: [string, "null"], format: date-time }
        catatan_pelaksanaan: { type: string }
        pelaksanaan_at: { type: [string, "null"], format: date-time }
        petugas_sudin: { $ref: "#/components/schemas/DisiplinKontak" }
        riwayat_hukuman:
          type: array
          description: Kasus lain pegawai yang sama yang sudah dijatuhi hukuman (dalam wilayah pembaca)
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              nomor: { type: string }
              tingkat: { $ref: "#/components/schemas/DisiplinTingkat" }
              jenis_hukuman_label: { type: string }
              tanggal_keputusan: { type: [string, "null"], format: date }
        riwayat:
          type: array
          items:
            type: object
            properties:
              dari_status: { type: string }
              ke_status: { $ref: "#/components/schemas/DisiplinStatus" }
              oleh_nama: { type: string }
              catatan: { type: string }
              created_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DisiplinRingkasan:
      type: object
      properties:
        per_status:
          type: object
          additionalProperties: { type: integer }
          example: { registrasi: 1, perlu_kelengkapan: 1, pemeriksaan: 2, menunggu_keputusan: 1, sanksi_ditetapkan: 0, tindak_lanjut: 1, selesai: 2, tidak_dilanjutkan: 1 }
        perlu_tindakan: { type: integer, description: "registrasi + pemeriksaan + sanksi_ditetapkan", example: 3 }
        menunggu_keputusan: { type: integer, example: 1 }
        tenggat_dekat:
          type: array
          description: Nomor kasus belum final dengan tenggat ≤ 5 hari kerja (termasuk yang lewat)
          items: { type: string, example: DSP-2026-0005 }

    # fragmen: surat
    JenisSurat:
      type: string
      enum: [tunjangan, aktif_mengajar, pengantar_kenaikan_pangkat, izin_cuti, pengantar_pensiun]

    StatusSurat:
      type: string
      enum: [draf, menunggu_ttd, final, dibatalkan]

    SuratJenisItem:
      type: object
      properties:
        kode: { $ref: "#/components/schemas/JenisSurat" }
        label: { type: string, example: Surat keterangan aktif mengajar }
        deskripsi: { type: string, example: Menerangkan guru aktif mengajar di satuan pendidikan tertentu. }

    SuratIsian:
      type: object
      required: [perihal, tanggal_surat]
      properties:
        perihal: { type: string, maxLength: 300, example: Keterangan aktif mengajar untuk pengurusan tunjangan profesi }
        tanggal_surat: { type: string, format: date, example: "2027-02-03" }
        nomor:
          type: string
          maxLength: 50
          description: Kosongkan untuk nomor urut otomatis `NNNN/PK.01.02/<tahun tanggal surat>`. Dicek unik (409 bila dipakai).
          example: 0188/PK.01.02/2027
        keterangan:
          type: string
          maxLength: 2000
          example: Yang bersangkutan benar aktif mengajar mata pelajaran IPA sebanyak 24 jam pelajaran per minggu.

    SuratBuatRequest:
      allOf:
        - type: object
          required: [jenis, pendidik_id]
          properties:
            jenis: { $ref: "#/components/schemas/JenisSurat" }
            pendidik_id: { type: string, format: uuid }
        - $ref: "#/components/schemas/SuratIsian"

    Surat:
      type: object
      properties:
        id: { type: string, format: uuid }
        nomor: { type: string, example: 0188/PK.01.02/2027 }
        jenis: { $ref: "#/components/schemas/JenisSurat" }
        jenis_label: { type: string, example: Surat keterangan aktif mengajar }
        status: { $ref: "#/components/schemas/StatusSurat" }
        perihal: { type: string }
        tanggal_surat: { type: string, format: date }
        keterangan: { type: string }
        kop: { type: string, example: Suku Dinas Pendidikan Kota Administrasi Jakarta Barat }
        penanda_tangan: { type: string, example: Kepala Suku Dinas Pendidikan Kota Administrasi Jakarta Barat }
        pendidik:
          type: object
          properties:
            id: { type: string, format: uuid }
            nama: { type: string }
            nip: { type: [string, "null"] }
            status_kepegawaian: { $ref: "#/components/schemas/StatusKepegawaian" }
            pangkat: { type: string }
            golongan: { type: string }
            jabatan: { type: string }
            jabatan_dapodik: { type: string }
        sekolah:
          type: object
          properties:
            id: { type: string, format: uuid }
            npsn: { type: string }
            nama: { type: string }
        dokumen:
          description: PDF buatan sistem untuk dicetak (ada sejak `menunggu_ttd`)
          allOf: [{ $ref: "#/components/schemas/Dokumen" }]
        dokumen_ttd:
          description: Hasil pindai surat bertanda tangan (ada saat `final`)
          allOf: [{ $ref: "#/components/schemas/Dokumen" }]
        final_at: { type: [string, "null"], format: date-time }
        diserahkan_at: { type: [string, "null"], format: date-time }
        alasan_batal: { type: string }
        riwayat:
          type: array
          description: Hanya di endpoint detail, urut dari yang terlama
          items:
            type: object
            properties:
              dari_status: { type: string }
              ke_status: { $ref: "#/components/schemas/StatusSurat" }
              oleh: { type: string, format: uuid }
              oleh_nama: { type: string }
              catatan: { type: string }
              created_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # fragmen: anjab
    AnjabStatus:
      type: string
      enum: [draf, dikirim, dikembalikan, ditetapkan]

    AnjabBeban:
      type: object
      required: [jenjang, mapel, tingkat, jp]
      properties:
        jenjang: { type: string, enum: [SD, SMP, SMA, SMK] }
        mapel: { type: string, maxLength: 100, example: IPA }
        tingkat: { type: integer, minimum: 1, maximum: 12, example: 7, description: "SD 1–6, SMP 7–9, SMA/SMK 10–12" }
        jp: { type: integer, minimum: 0, maximum: 40, example: 5, description: JP per rombel per minggu }

    AnjabPeriodeRequest:
      type: object
      required: [tahun_ajaran, jenjang, tanggal_buka, tanggal_tutup, jam_wajib, rasio_sd, rasio_smp, rasio_sma, batas_tmt_pensiun]
      properties:
        tahun_ajaran: { type: string, pattern: "^[0-9]{4}/[0-9]{4}$", example: 2026/2027 }
        jenjang:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: string, enum: [SD, SMP, SMA, SMK] }
        tanggal_buka: { type: string, format: date, example: "2026-11-17" }
        tanggal_tutup: { type: string, format: date, example: "2026-12-05" }
        acuan_peraturan: { type: string, maxLength: 200, example: Pergub DKI No. 00 Tahun 2026 }
        jam_wajib: { type: integer, minimum: 1, maximum: 60, example: 24, description: JP wajib mengajar per minggu }
        rasio_sd: { type: integer, minimum: 1, maximum: 100, example: 28, description: Siswa per rombel SD }
        rasio_smp: { type: integer, minimum: 1, maximum: 100, example: 32 }
        rasio_sma: { type: integer, minimum: 1, maximum: 100, example: 36, description: Berlaku untuk SMA dan SMK }
        batas_tmt_pensiun:
          type: string
          format: date
          example: "2027-07-31"
          description: Guru dengan TMT pensiun pada atau sebelum tanggal ini tidak dihitung tersedia
        beban:
          type: array
          maxItems: 600
          items: { $ref: "#/components/schemas/AnjabBeban" }

    AnjabPeriode:
      allOf:
        - $ref: "#/components/schemas/AnjabPeriodeRequest"
        - type: object
          properties:
            id: { type: string, format: uuid }
            sudin_id: { type: string, format: uuid }
            terkunci: { type: boolean, description: true setelah masa pembaruan dibuka }
            dibuka_at: { type: [string, "null"], format: date-time }
            progres:
              type: object
              description: Hanya di detail. Jumlah sekolah per status.
              example: { draf: 24, dikirim: 11, dikembalikan: 3, ditetapkan: 4, total: 42 }
              additionalProperties: { type: integer }
            created_at: { type: string, format: date-time }

    AnjabBarisMapel:
      type: object
      properties:
        mapel: { type: string, example: IPA }
        kebutuhan: { type: integer, example: 3 }
        tersedia: { type: integer, example: 2 }
        selisih: { type: integer, example: -1, description: "tersedia - kebutuhan; negatif = kurang" }

    AnjabVersiHasil:
      type: object
      properties:
        mapel: { type: array, items: { $ref: "#/components/schemas/AnjabBarisMapel" } }
        kurang: { type: integer, example: 3 }
        lebih: { type: integer, example: 2 }

    AnjabHasil:
      type: object
      properties:
        guru_total: { type: integer, example: 48 }
        guru_dihitung: { type: integer, example: 47 }
        guru_pensiun: { type: integer, example: 1 }
        total_rombel: { type: integer, example: 27 }
        total_siswa: { type: integer, example: 851 }
        rombel:
          type: array
          items:
            type: object
            properties:
              tingkat: { type: integer, example: 7 }
              jumlah_rombel: { type: integer, example: 9 }
              jumlah_siswa: { type: integer, example: 288 }
              rata_rata: { type: number, example: 32.0 }
              rombel_dihitung: { type: integer, example: 9 }
        versi_sk: { $ref: "#/components/schemas/AnjabVersiHasil" }
        versi_riil: { $ref: "#/components/schemas/AnjabVersiHasil" }
        perbedaan:
          type: array
          description: Guru yang mapel riilnya berbeda dari mapel SK
          items:
            type: object
            properties:
              nama: { type: string, example: "Dewi Anggraini, S.Pd.Gr." }
              mapel_sk: { type: string, example: Bahasa Indonesia }
              mapel_riil: { type: string, example: Prakarya }

    AnjabGuru:
      type: object
      properties:
        id: { type: string, format: uuid }
        pendidik_id: { type: string, format: uuid }
        nama: { type: string }
        nip: { type: [string, "null"] }
        status_kepegawaian: { $ref: "#/components/schemas/StatusKepegawaian" }
        golongan: { type: string }
        mapel_sk: { type: string, example: Bahasa Indonesia }
        mapel_riil: { type: string, example: Prakarya }
        jp_riil: { type: integer, example: 24 }
        tmt_pensiun: { type: [string, "null"], format: date }
        dihitung: { type: boolean, description: false bila TMT pensiun pada atau sebelum batas periode }

    AnjabSekolah:
      type: object
      properties:
        id: { type: string, format: uuid }
        periode_id: { type: string, format: uuid }
        tahun_ajaran: { type: string, example: 2026/2027 }
        tenggat: { type: string, format: date }
        sekolah:
          type: object
          properties:
            id: { type: string, format: uuid }
            npsn: { type: string }
            nama: { type: string }
            jenjang: { type: string }
            kecamatan: { type: string }
        status: { $ref: "#/components/schemas/AnjabStatus" }
        kiriman_ke: { type: integer, example: 2 }
        dikirim_at: { type: [string, "null"], format: date-time }
        catatan_sudin: { type: string }
        ditinjau_at: { type: [string, "null"], format: date-time }
        jumlah_rombel: { type: integer, example: 27 }
        jumlah_guru: { type: integer, example: 48 }
        rombel:
          type: array
          description: Hanya di detail
          items:
            type: object
            properties:
              tingkat: { type: integer }
              jumlah_rombel: { type: integer }
              jumlah_siswa: { type: integer }
        guru:
          type: array
          description: Hanya di detail
          items: { $ref: "#/components/schemas/AnjabGuru" }
        hasil:
          description: Hanya di detail. Dibekukan saat ditetapkan; sebelumnya dihitung dari data terkini.
          allOf: [{ $ref: "#/components/schemas/AnjabHasil" }]
        riwayat:
          type: array
          description: Hanya di detail, urut dari yang terlama
          items:
            type: object
            properties:
              dari_status: { type: string }
              ke_status: { $ref: "#/components/schemas/AnjabStatus" }
              oleh_nama: { type: string }
              catatan: { type: string }
              created_at: { type: string, format: date-time }

    AnjabImporHasil:
      type: object
      properties:
        nama_berkas: { type: string, example: master_anjab_2026-2027.xlsx }
        total_baris: { type: integer, example: 412 }
        baris_valid: { type: integer, example: 405 }
        baris_bermasalah: { type: integer, example: 7 }
        valid_per_lembar:
          type: object
          additionalProperties: { type: integer }
          example: { Sekolah: 42, Rombel: 180, Guru: 183 }
        galat:
          type: array
          items:
            type: object
            properties:
              baris: { type: integer, example: 14, description: Nomor baris di Excel }
              lembar: { type: string, enum: [Sekolah, Rombel, Guru] }
              kolom: { type: string, example: TMT CPNS }
              nilai: { type: string, example: 2010/31/01 }
              masalah: { type: string, example: format tanggal harus YYYY-MM-DD }
        tersimpan: { type: boolean }

    AnjabMonitoring:
      type: object
      properties:
        periode_id: { type: string, format: uuid }
        tahun_ajaran: { type: string }
        total_sekolah: { type: integer, example: 42 }
        sekolah_ditetapkan: { type: integer, example: 38 }
        kekurangan_guru: { type: integer, description: Jumlah kurang (versi riil) di sekolah yang ditetapkan }
        kelebihan_guru: { type: integer }
        rekomendasi:
