        - { name: sampai, in: query, schema: { type: string, format: date } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: aksi, in: query, schema: { type: string, enum: [melihat, mengunduh, mengunggah, mengganti_versi] } }
