openapi: 3.1.0
info:
  title: Teralur API
  version: 0.1.0
  description: |
    Backend layanan kepegawaian guru Sudin Pendidikan DKI (Teralur v0.9).
    Cakupan: fondasi (akun, sekolah, pendidik, dokumen, notifikasi), Cuti, Pensiun, Kenaikan Pangkat,
    Sikap Disiplin, Layanan Dapodik, Kinerja P3K PW, Generator Surat, Analisis Jabatan, Arsip Kepegawaian,
    dan Dasbor lintas modul. Asumsi dan pertanyaan terbuka per modul ada di `docs/catatan/`.

    **Peran**
    - `staf_sudin`: memeriksa dan memproses pengajuan di sekolah wilayah Sudin-nya.
    - `operator_sekolah`: mengajukan dan memantau pengajuan untuk guru di sekolahnya.
    - `pimpinan`: melihat data di wilayah Sudin-nya (baca saja).
    - `admin`: akses semua data.

    **Autentikasi**: tidak ada pendaftaran mandiri; akun dibuat Sudin lewat `/api/akun`.
    Login lewat `POST /api/auth/login` (nama pengguna atau email), lalu kirim `Authorization: Bearer <access_token>`.
    Access token berlaku 15 menit; perbarui lewat `POST /api/auth/refresh`.

    **Akun bawaan Docker**: admin `admin@teralur.test` / `admin12345` (dari `ADMIN_EMAIL`/`ADMIN_PASSWORD`).
    Dengan `SEED_DEMO=true` tersedia juga (password `teralur123`): `staf.jb@teralur.test`, `pimpinan.jb@teralur.test`,
    `operator.smpn45@teralur.test`, `operator.sdnrawabuaya09@teralur.test`, `staf.js@teralur.test`.
servers:
  - url: /
    description: Server yang sedang menyajikan dokumentasi ini
tags:
  - name: Auth
  - name: Akun Saya
  - name: Manajemen Akun
    description: |
      Akun dikelola Sudin. `staf_sudin` mengelola akun operator sekolah di wilayahnya dan sesama staf Sudin-nya;
      akun `pimpinan` dan `admin` hanya dikelola `admin`. Menghapus akun = menonaktifkan (riwayat tetap utuh).
  - name: Sekolah
  - name: Pendidik
  - name: Dokumen
  - name: Notifikasi
  - name: Cuti
    description: |
      Alur (Figma C1–C6): operator **ajukan** → Sudin **periksa** berkas digital →
      (jika kurang: operator **perbaikan**) → Sudin **terima surat fisik** + nota dinas →
      tanda tangan basah pejabat (di luar sistem) → Sudin **catat keputusan**.

      Status: `diajukan`, `perlu_perbaikan`, `menunggu_surat_fisik`, `diproses_sudin`, `disetujui`, `ditolak`.
  - name: Pensiun
    description: |
      Alur (Figma P1–P6): operator **pilih guru** (`GET /api/pensiun/perkiraan`) → **unggah 14 berkas** satu per satu
      (`POST /api/pensiun/berkas`, PDF maks 2 MB) → **ajukan** dengan pernyataan sudah memeriksa berkas →
      Sudin **verifikasi per berkas** (Valid / Tidak valid + alasan) → bila ada yang tidak valid, operator
      **unggah ulang berkas yang ditolak saja** → Sudin **catat pengiriman ke BKD** (pengiriman di luar sistem) →
      Sudin **unggah SK pensiun** dan pengajuan **Selesai**.
      Status: `diajukan` → (`perlu_perbaikan` ↔ `diajukan`) → `terverifikasi` → `diusulkan_ke_bkd` → `selesai`.

  - name: Kenaikan Pangkat
    description: |
      Alur (Figma K1–K6): operator **cari guru** (`GET /api/kenaikan-pangkat/perkiraan`, golongan berikutnya dihitung otomatis) →
      **unggah 6 berkas** satu per satu (`POST /api/kenaikan-pangkat/berkas`, PDF maks 2 MB) → **ajukan** →
      Sudin **verifikasi per berkas** → bila ada yang tidak valid, operator **unggah ulang berkas yang ditolak saja** →
      Sudin **catat pengiriman ke BKD** untuk beberapa usulan sekaligus (satu surat pengantar) →
      Sudin **unggah SK**: pangkat/golongan di data induk pendidik diperbarui dan pengajuan **Selesai**.
      Status: `diajukan` → (`perlu_perbaikan` ↔ `diajukan`) → `terverifikasi` → `diusulkan_ke_bkd` → `selesai`.

  - name: Sikap Disiplin
    description: |
      Alur (Figma DS1–DS9): operator **lapor** dugaan pelanggaran → Sudin **verifikasi** awal
      (layak / perlu kelengkapan / tidak layak) → (jika kurang: operator **kelengkapan**, lalu verifikasi ulang) →
      Sudin catat **pemeriksaan** (surat panggilan, BAP, tanggapan pegawai; pemanggilan dan BAP di luar sistem) →
      Sudin ajukan **rekomendasi** hukuman → **pimpinan** menetapkan **keputusan** (setujui, ubah tingkat, atau kembalikan) →
      Sudin **catat keputusan** final (nomor, tanggal, salinan, masa hukuman) → **tindak lanjut** (bukti penyampaian,
      I'DIS BKN untuk PNS, upaya administratif) + operator kirim **laporan pelaksanaan** → Sudin **tutup** kasus.

      Status: `registrasi`, `perlu_kelengkapan`, `pemeriksaan`, `menunggu_keputusan`, `sanksi_ditetapkan`,
      `tindak_lanjut`, `selesai`, `tidak_dilanjutkan`.

      Data sensitif: operator hanya melihat kasus sekolahnya dan tidak melihat pemeriksaan, BAP, rekomendasi,
      catatan pimpinan, maupun berkas internal. Berkas kasus diunduh lewat `/api/disiplin/{id}/dokumen/{dokumen_id}`.

  - name: Generator Surat
    description: |
      Alur (Figma S1–S5): staf Sudin **pilih jenis surat** → isi data surat untuk seorang pendidik
      (data guru diisi dari master) dan **simpan draf** → **pratinjau** PDF → **buat dokumen**
      (PDF disimpan, status `menunggu_ttd`) → cetak dan tanda tangan basah Kepala Sudin (di luar sistem) →
      **unggah hasil pindai** (status `final`) → **tandai diserahkan** ke guru/sekolah.
      Surat `draf` atau `menunggu_ttd` bisa **dibatalkan**. Surat `final` terkunci.

      Peran: `staf_sudin` dan `admin` mengelola; `pimpinan` hanya membaca; `operator_sekolah` tidak punya akses
      (hasil pindai final tetap bisa diunduh operator lewat `/api/dokumen/{id}` karena tersimpan di arsip sekolah).

      Status: `draf`, `menunggu_ttd`, `final`, `dibatalkan`.

  - name: Analisis Jabatan
    description: |
      Alur (Figma A1–A6) per periode tahun ajaran milik satu Sudin:
      staf Sudin **membuat periode & parameter** (jam wajib, rasio siswa/rombel, batas TMT pensiun, beban JP) →
      **impor spreadsheet master** (lembar Sekolah, Rombel, Guru; validasi per baris, simpan baris valid) →
      **buka masa pembaruan** (parameter terkunci, semua sekolah jenjang periode jadi `draf`) →
      operator sekolah **perbarui rombel & guru** lalu **kirim** → staf Sudin **tinjau**: tetapkan atau kembalikan
      dengan catatan → **monitoring & rekomendasi pemerataan** dari hasil yang sudah ditetapkan.

      Status per sekolah: `draf`, `dikirim`, `dikembalikan`, `ditetapkan` (final; hasil hitungan dibekukan).

      Hitungan dua basis (versi SK dan versi kondisi riil):
      kebutuhan mapel = ceil(Σ rombel_dihitung × JP mapel per tingkat / jam wajib);
      kebutuhan guru kelas SD = Σ rombel_dihitung; rombel_dihitung = min(jumlah rombel, ceil(siswa / rasio)).
      Tersedia = guru di daftar yang TMT pensiunnya (awal bulan setelah usia 60) jatuh setelah batas periode.

  - name: Layanan Dapodik
    description: |
      Alur (Figma DP1–DP5): operator **pilih jenis layanan dan isi formulir** (tiket `baru`) →
      staf Sudin (admin Dapodik) **tinjau**: minta info tambahan (`perlu_info_tambahan`) atau
      proses di aplikasi Dapodik (di luar sistem) lalu **tandai selesai** dengan catatan →
      bila diminta, operator **lengkapi** info dan tiket kembali `baru`.

      Jenis: `revisi_akun_operator`, `autentikasi_ptk`, `kode_referral_yayasan`, `perbaikan_data_ptk`, `lainnya`.
      Status: `baru`, `perlu_info_tambahan`, `selesai` (final). Nomor tiket `DPK-YYYY-NNNN`.

  - name: Kinerja P3K PW
    description: |
      Alur (Figma KP1–KP5): operator pilih periode dan pegawai `PPPK_PW`, **isi nilai BerAKHLAK** (draf) →
      **buat dokumen penilaian** PDF (`menunggu_ttd`) → operator cetak dan antar ke Sudin, Pejabat Penilai
      tanda tangan basah (di luar sistem) → staf Sudin **unggah hasil pindai** dan tetapkan `final`.

      Skala 1–5 untuk tujuh parameter; nilai akhir = rata-rata, 1 desimal; predikat Sangat kurang / Kurang /
      Cukup / Baik (3,5–4,4) / Sangat baik. Status: `draf`, `menunggu_ttd`, `final`. Nomor `P3K-YYYY-NNNN`.

  - name: Arsip Kepegawaian
    description: |
      Arsip dokumen kepegawaian per guru (Figma R1–R4, H4). Dokumen final dari modul Cuti, Pensiun,
      Kenaikan Pangkat, Generator Surat, dan Kinerja P3K PW masuk otomatis (tampil "Sistem · modul X").
      Operator, staf Sudin, dan admin bisa mengarsipkan dokumen manual (PDF/JPG, maks. 5 MB) dan menyimpan versi baru;
      dokumen dari modul hanya bisa diganti versinya oleh Sudin. Setiap lihat, unduh, unggah, dan ganti versi tercatat
      di log yang tidak dapat diubah (R4). Kasus disiplin tidak diarsipkan di sini.

      Kategori: `sk`, `tunjangan`, `ijazah`, `kinerja`, `surat`, `lainnya`.

  - name: Dasbor Lintas Modul
    description: |
      Tampilan gabungan dari semua modul, hanya membaca dan dibatasi scope peran:
      Tugas Saya (T1, H1 "Perlu tindakan", B1), Daftar Pengajuan (D03, H1 "Pengajuan berjalan"),
      dan ringkasan bulanan (D02, B1, B2) termasuk rekap PDF.
      Tenggat tugas dihitung dalam hari kerja sejak perubahan status terakhir (Disiplin, Dapodik, dan Anjab memakai tenggat modulnya).
      Untuk pimpinan, identitas guru pada kasus disiplin tidak ditampilkan di daftar.

security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Masuk
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              description: Isi `username` (layar L1) atau `email`.
              properties:
                username: { type: string, maxLength: 50, example: staf.jb }
                email: { type: string, format: email, example: staf.jb@teralur.test }
                password: { type: string, maxLength: 72, example: teralur123 }
      responses:
        "200":
          description: Berhasil masuk
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Token" }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: Nama pengguna/email atau password salah (pesan sama untuk keduanya)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Akun dinonaktifkan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Perbarui access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Token baru
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Error" }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Keluar (hapus semua refresh token akun)
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Error" }

  /api/user/me:
    get:
      tags: [Akun Saya]
      summary: Akun yang sedang login
      responses:
        "200":
          description: Data akun
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /api/user/me/password:
    put:
      tags: [Akun Saya]
      summary: Ganti password sendiri
      description: Semua sesi (refresh token) akun ikut dicabut; masuk lagi dengan password baru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_lama, password_baru]
              properties:
                password_lama: { type: string }
                password_baru: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/user/me/riwayat-masuk:
    get:
      tags: [Akun Saya]
      summary: Riwayat masuk (10 terakhir, U1)
      responses:
        "200":
          description: Riwayat masuk, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            waktu: { type: string, format: date-time }
                            perangkat: { type: string, example: "Chrome · Windows" }

  /api/user/me/keluar-sesi-lain:
    post:
      tags: [Akun Saya]
      summary: Keluarkan semua sesi lain (U1)
      description: Mencabut semua refresh token akun kecuali milik sesi ini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, description: Refresh token sesi ini }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/akun:
    get:
      tags: [Manajemen Akun]
      summary: Daftar akun di wilayah Sudin
      description: Hanya `staf_sudin` dan `admin`. Staf melihat operator sekolah di wilayahnya serta staf dan pimpinan Sudin-nya.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: search
          in: query
          description: Nama atau email (sebagian)
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: sekolah_id
          in: query
          schema: { type: string, format: uuid }
        - name: aktif
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Daftar akun
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Manajemen Akun]
      summary: Tambah akun
      description: |
        `operator_sekolah` wajib `sekolah_id` (sekolah di wilayah Anda).
        `staf_sudin`/`pimpinan` ditempatkan di Sudin pembuat; admin wajib mengisi `sudin_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, password]
              properties:
                username: { type: string, pattern: "^[a-z0-9._]{3,50}$", example: operator.smpn45, description: Untuk masuk; opsional, unik }
                nip: { type: string, pattern: "^[0-9]{18}$" }
                name: { type: string, example: Dedi Kurniawan }
                email: { type: string, format: email, example: operator.smpn45@teralur.test }
                telp_number: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                sekolah_id: { type: string, format: uuid }
                sudin_id: { type: string, format: uuid, description: Hanya dipakai admin }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "201":
          description: Akun dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/akun/{id}:
    get:
      tags: [Manajemen Akun]
      summary: Detail akun
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Akun
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Manajemen Akun]
      summary: Ubah akun (kirim semua kolom)
      description: "`is_aktif: true` juga dipakai untuk mengaktifkan kembali akun yang dinonaktifkan."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, is_aktif]
              properties:
                username: { type: string, pattern: "^[a-z0-9._]{3,50}$" }
                nip: { type: string, pattern: "^[0-9]{18}$" }
                name: { type: string }
                email: { type: string, format: email }
                telp_number: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                sekolah_id: { type: string, format: uuid }
                sudin_id: { type: string, format: uuid }
                is_aktif: { type: boolean }
      responses:
        "200":
          description: Akun diubah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Manajemen Akun]
      summary: Nonaktifkan akun
      description: Akun tidak bisa login dan semua sesinya dicabut. Data dan riwayatnya tetap tersimpan.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/akun/{id}/password:
    put:
      tags: [Manajemen Akun]
      summary: Ganti password akun lain
      description: Semua sesi akun tersebut dicabut, jadi pemiliknya harus login ulang dengan password baru.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_baru]
              properties:
                password_baru: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/sekolah:
    get:
      tags: [Sekolah]
      summary: Daftar sekolah sesuai scope peran
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: search
          in: query
          description: Nama sekolah (sebagian) atau NPSN (persis)
          schema: { type: string }
        - name: jenjang
          in: query
          schema: { type: string, enum: [SD, SMP, SMA, SMK, SLB] }
      responses:
        "200":
          description: Daftar sekolah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Sekolah" }

  /api/sekolah/{id}:
    get:
      tags: [Sekolah]
      summary: Detail sekolah
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Sekolah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Sekolah" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Sekolah]
      summary: Ubah kepala sekolah, kecamatan, dan alamat
      description: Hanya `staf_sudin` (sekolah di wilayahnya) dan `admin`. NPSN, nama, dan jenjang tidak diubah di sini.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kepala_sekolah: { type: string, maxLength: 150, example: "Drs. Sutrisno Wibowo, M.Pd." }
                kecamatan: { type: string, maxLength: 100 }
                alamat: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Sekolah setelah diubah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Sekolah" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/sekolah/{id}/profil:
    get:
      tags: [Sekolah]
      summary: Profil sekolah untuk halaman profil akun (H5)
      description: Data sekolah beserta kontak Sudin, jumlah guru per status kepegawaian, nama operator aktif, dan nama petugas Sudin aktif.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Profil sekolah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Sekolah"
                          - type: object
                            properties:
                              jumlah_guru: { type: integer, example: 8 }
                              guru_per_status:
                                type: object
                                additionalProperties: { type: integer }
                                example: { PNS: 5, PPPK: 3 }
                              operator: { type: array, items: { type: string }, example: ["Dedi Kurniawan"] }
                              petugas_sudin: { type: array, items: { type: string }, example: ["Bimo Rajendra"] }
        "404": { $ref: "#/components/responses/Error" }

  /api/sudin/{id}/kontak:
    put:
      tags: [Sekolah]
      summary: Ubah kontak layanan Sudin (tampil di profil sekolah)
