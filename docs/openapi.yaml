  /api/cuti:
    get:
      tags: [Cuti]
      summary: Daftar pengajuan cuti (antrean Sudin / status sekolah)
      description: |
        Staf Sudin dan Pimpinan melihat sekolah di wilayahnya; Operator hanya sekolahnya.
        Tab di layar C6: Perlu Perbaikan = `status=perlu_perbaikan`,
        Dalam proses = `status=diajukan,menunggu_surat_fisik,diproses_sudin`, Selesai = `status=disetujui,ditolak`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          description: Satu atau beberapa status dipisah koma
          schema: { type: string, example: "diajukan,perlu_perbaikan" }
        - name: jenis
          in: query
          schema: { $ref: "#/components/schemas/JenisCuti" }
        - name: sekolah_id
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Nomor registrasi, nama guru, atau awalan NIP
          schema: { type: string }
      responses:
        "200":
          description: Daftar cuti, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Cuti" }
    post:
      tags: [Cuti]
      summary: Ajukan cuti guru (C1)
      description: |
        Hanya `operator_sekolah`, untuk pendidik di sekolahnya. Diisi setelah permohonan disetujui Kepala Sekolah.
        Validasi: tanggal selesai ≥ mulai, ada hari kerja, tidak bertumpuk dengan pengajuan lain yang belum ditolak,
        dan untuk cuti tahunan tidak melebihi sisa jatah 12 hari kerja.
        Staf Sudin di wilayah sekolah mendapat notifikasi.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pendidik_id, jenis, tanggal_mulai, tanggal_selesai, alasan, disetujui_kepsek, berkas]
              properties:
                pendidik_id: { type: string, format: uuid }
                jenis: { $ref: "#/components/schemas/JenisCuti" }
                tanggal_mulai: { type: string, format: date, example: "2026-11-03" }
                tanggal_selesai: { type: string, format: date, example: "2026-11-07" }
                alasan: { type: string, maxLength: 1000 }
                disetujui_kepsek:
                  type: boolean
                  description: Harus `true`, permohonan sudah ditandatangani Kepala Sekolah
                berkas:
                  type: string
                  format: binary
                  description: Surat permohonan bertanda tangan (PDF/JPG/PNG, maks 10 MB)
      responses:
        "201":
          description: Pengajuan terkirim, status `diajukan`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Cuti" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/cuti/ringkasan:
    get:
      tags: [Cuti]
      summary: Jumlah pengajuan per status (kartu antrean Q1)
      responses:
        "200":
          description: Jumlah per status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: { type: integer }
                        example:
                          diajukan: 3
                          perlu_perbaikan: 1
                          menunggu_surat_fisik: 2
                          diproses_sudin: 1
                          disetujui: 12
                          ditolak: 0

  /api/cuti/sisa-tahunan:
    get:
      tags: [Cuti]
      summary: Sisa cuti tahunan seorang pendidik
      description: Jatah 12 hari kerja dikurangi cuti tahunan yang belum ditolak. Libur nasional dan akumulasi tahun lalu belum dihitung.
      parameters:
        - name: pendidik_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: tahun
          in: query
          description: Default tahun berjalan
          schema: { type: integer, example: 2026 }
      responses:
        "200":
          description: Sisa cuti
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pendidik_id: { type: string, format: uuid }
                          tahun: { type: integer }
                          jatah: { type: integer, example: 12 }
                          terpakai: { type: integer, example: 3 }
                          sisa: { type: integer, example: 9 }
        "404": { $ref: "#/components/responses/Error" }

  /api/cuti/{id}:
    get:
      tags: [Cuti]
      summary: Detail pengajuan cuti beserta riwayat status
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Cuti" }
        "404": { $ref: "#/components/responses/Error" }

  /api/cuti/{id}/perbaikan:
    post:
      tags: [Cuti]
      summary: Unggah ulang berkas (operator)
      description: Hanya saat status `perlu_perbaikan`. Status kembali ke `diajukan`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas]
              properties:
                berkas: { type: string, format: binary }
                alasan: { type: string, description: Opsional, mengganti alasan lama }
      responses:
        "200":
          description: Perbaikan terkirim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Cuti" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/cuti/{id}/periksa:
    post:
      tags: [Cuti]
      summary: Simpan hasil periksa berkas digital (C3)
      description: |
        Hanya saat status `diajukan`. Jika lengkap dan terbaca → `menunggu_surat_fisik`;
        selain itu → `perlu_perbaikan` dan `catatan` wajib diisi. Operator mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [berkas_lengkap, berkas_terbaca]
              properties:
                berkas_lengkap: { type: boolean }
                berkas_terbaca: { type: boolean }
                catatan:
                  type: string
                  example: Halaman 2 (tanda tangan Kepala Sekolah) buram. Mohon pindai ulang minimal 200 dpi.
      responses:
        "200":
          description: Hasil tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Cuti" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/cuti/terima-surat-fisik:
    post:
      tags: [Cuti]
      summary: Tandai surat fisik + nota dinas diterima (C4, bisa banyak sekaligus)
      description: |
        Semua pengajuan harus berstatus `menunggu_surat_fisik`; jika satu gagal, tidak ada yang tersimpan.
        `nota_dinas_ada` harus `true`. Status menjadi `diproses_sudin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cuti_ids, tanggal_diterima, nota_dinas_ada]
              properties:
                cuti_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
                tanggal_diterima: { type: string, format: date, example: "2026-10-28" }
                penerima_id:
                  type: string
                  format: uuid
                  description: Staf Sudin penerima di loket. Default akun yang login.
                nota_dinas_ada: { type: boolean }
                catatan: { type: string }
      responses:
        "200":
          description: Penerimaan tercatat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          diterima:
                            type: array
                            items: { type: string, example: CUT-2026-0142 }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/cuti/{id}/keputusan:
    post:
      tags: [Cuti]
      summary: Catat keputusan pejabat (C5)
      description: Hanya saat status `diproses_sudin`. Keputusan final dan tidak bisa diubah.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [keputusan, nomor_surat_izin, tanggal_surat_izin, surat_izin]
              properties:
                keputusan: { type: string, enum: [disetujui, ditolak] }
                nomor_surat_izin: { type: string, example: 800.1.11.3/1287/SDP.I/XI/2026 }
                tanggal_surat_izin: { type: string, format: date, example: "2026-10-30" }
                surat_izin: { type: string, format: binary, description: Hasil pindai surat bertanda tangan basah }
                catatan: { type: string, example: Surat asli dapat diambil di loket mulai 3 Nov }
      responses:
        "200":
          description: Keputusan tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Cuti" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # fragmen: pensiun
  /api/pensiun:
    get:
      tags: [Pensiun]
      summary: Daftar pengajuan pensiun (antrean Sudin Q2 / status sekolah P6)
      description: |
        Staf Sudin dan Pimpinan melihat sekolah di wilayahnya; Operator hanya sekolahnya.
        Item daftar tidak memuat `berkas` dan `riwayat`, hanya `jumlah_berkas` dan `berkas_tidak_valid`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          description: Satu atau beberapa status dipisah koma
          schema: { type: string, example: "diajukan,perlu_perbaikan" }
        - name: sekolah_id
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Nomor registrasi, nama guru, atau awalan NIP
          schema: { type: string }
      responses:
        "200":
          description: Daftar pensiun, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PensiunPengajuan" }
    post:
      tags: [Pensiun]
      summary: Ajukan pensiun guru (P2)
      description: |
        Hanya `operator_sekolah`, untuk pendidik PNS di sekolahnya; satu pengajuan per pendidik (status apa pun).
        `berkas` memetakan **ke-14 kode** dari `GET /api/pensiun/persyaratan` ke id dokumen hasil
        `POST /api/pensiun/berkas` (diunggah akun yang sama untuk sekolah yang sama dan belum dipakai pengajuan lain).
        `batas_usia`: TMT = tanggal 1 bulan sesudah ulang tahun ke-60 (butuh `tanggal_lahir` pendidik).
        `atas_permintaan_sendiri`: `tmt_pensiun` wajib, tanggal 1, di masa depan.
        Staf Sudin di wilayah sekolah mendapat notifikasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pendidik_id, jenis, pernyataan_diperiksa, berkas]
              properties:
                pendidik_id: { type: string, format: uuid }
                jenis: { $ref: "#/components/schemas/PensiunJenis" }
                tmt_pensiun:
                  type: string
                  format: date
                  example: "2027-06-01"
                  description: Wajib untuk atas_permintaan_sendiri, diabaikan untuk batas_usia
                pernyataan_diperiksa:
                  type: boolean
                  description: Harus `true` ("Saya sudah memeriksa isi setiap berkas")
                berkas:
                  type: object
                  description: Kode jenis berkas → id dokumen (14 entri)
                  additionalProperties: { type: string, format: uuid }
                  example: { sk_cpns: 5c2f6a8e-0000-0000-0000-000000000000, sk_pns: 6d3f6a8e-0000-0000-0000-000000000000 }
      responses:
        "201":
          description: Pengajuan terkirim, status `diajukan`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PensiunPengajuan" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/pensiun/persyaratan:
    get:
      tags: [Pensiun]
      summary: Daftar 14 berkas persyaratan pensiun (P2)
      responses:
        "200":
          description: Kode, label, dan kelompok berkas, urut seperti di layar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PensiunJenisBerkas" }

  /api/pensiun/perkiraan:
    get:
      tags: [Pensiun]
      summary: Data guru dan TMT pensiun batas usia sebelum mengajukan (P1)
      description: Pendidik harus dalam scope akun. `kendala` kosong berarti pendidik bisa diajukan dengan jenis batas usia.
      parameters:
        - name: pendidik_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Perkiraan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PensiunPerkiraan" }
        "404": { $ref: "#/components/responses/Error" }

  /api/pensiun/berkas:
    post:
      tags: [Pensiun]
      summary: Unggah satu berkas persyaratan (P2)
      description: |
        Hanya `operator_sekolah`. PDF, maks 2 MB. Berkas belum terikat pengajuan sampai dirujuk di
        `POST /api/pensiun` atau `POST /api/pensiun/{id}/perbaikan`. Diunggah satu per satu supaya
        14 berkas tidak melebihi batas ukuran request (11 MiB).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas]
              properties:
                berkas: { type: string, format: binary }
      responses:
        "201":
          description: Berkas tersimpan; pakai `data.id` di pengajuan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Dokumen" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/pensiun/ringkasan:
    get:
      tags: [Pensiun]
      summary: Jumlah pengajuan per status (kartu antrean Q2)
      responses:
        "200":
          description: Jumlah per status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: { type: integer }
                        example: { diajukan: 2, perlu_perbaikan: 1, terverifikasi: 1, diusulkan_ke_bkd: 1, selesai: 2 }

  /api/pensiun/{id}:
    get:
      tags: [Pensiun]
      summary: Detail pengajuan pensiun beserta berkas dan riwayat status
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PensiunPengajuan" }
        "404": { $ref: "#/components/responses/Error" }

  /api/pensiun/{id}/perbaikan:
    post:
      tags: [Pensiun]
      summary: Unggah ulang berkas yang tidak valid (operator, P6)
      description: |
        Hanya saat status `perlu_perbaikan`. `berkas` harus berisi persis semua berkas yang dinyatakan
        tidak valid (berkas valid tidak boleh diganti). Berkas pengganti kembali "belum dinilai";
        status kembali ke `diajukan` dan staf Sudin mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [berkas]
              properties:
                berkas:
                  type: object
                  additionalProperties: { type: string, format: uuid }
                  example: { skp_terakhir: 5c2f6a8e-0000-0000-0000-000000000000 }
      responses:
        "200":
          description: Perbaikan terkirim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PensiunPengajuan" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/pensiun/{id}/verifikasi:
    post:
      tags: [Pensiun]
      summary: Verifikasi berkas per jenis (P3)
      description: |
        Hanya `staf_sudin`, saat status `diajukan`. Berkas yang tidak disebut mempertahankan penilaian
        sebelumnya, tetapi setelah digabung semua berkas wajib sudah dinilai (putaran pertama: ke-14 berkas;
        sesudah perbaikan: cukup berkas pengganti). Berkas tidak valid wajib punya `catatan`.
        Semua valid → `terverifikasi`; ada yang tidak valid → `perlu_perbaikan`. Operator mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [penilaian]
              properties:
                penilaian:
                  type: array
                  minItems: 1
                  maxItems: 14
                  items: { $ref: "#/components/schemas/PensiunPenilaian" }
      responses:
        "200":
          description: Penilaian tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PensiunPengajuan" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/pensiun/{id}/kirim-bkd:
    post:
      tags: [Pensiun]
      summary: Catat pengiriman usulan ke BKD (P4)
      description: Hanya `staf_sudin`, saat status `terverifikasi`. Pengiriman dilakukan di luar sistem; status menjadi `diusulkan_ke_bkd`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nomor_surat_pengantar, tanggal_kirim]
              properties:
                nomor_surat_pengantar: { type: string, maxLength: 100, example: 800.1.6.1/2214/SDP.I/XI/2026 }
                tanggal_kirim: { type: string, format: date, example: "2026-11-12", description: Tidak boleh di masa depan }
                cara_kirim: { type: string, maxLength: 100, example: Diantar langsung ke BKD }
                catatan: { type: string, maxLength: 1000, example: "Diterima petugas loket BKD, nomor agenda 4471." }
                bukti: { type: string, format: binary, description: Opsional, tanda terima BKD (PDF/JPG/PNG) }
      responses:
        "200":
          description: Pengiriman tercatat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PensiunPengajuan" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/pensiun/{id}/sk:
    post:
      tags: [Pensiun]
      summary: Unggah SK pensiun dan selesaikan (P5)
      description: |
        Hanya `staf_sudin`, saat status `diusulkan_ke_bkd`. Status menjadi `selesai` (final, tidak bisa diubah),
        SK diarsipkan, operator sekolah mendapat notifikasi dan dapat mengunduhnya. `tmt_pensiun` opsional,
        mengganti TMT bila SK menyebut tanggal lain.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nomor_sk, tanggal_sk, sk]
              properties:
                nomor_sk: { type: string, maxLength: 100, example: 882/3215/BKD/2026 }
                tanggal_sk: { type: string, format: date, example: "2026-11-14", description: Tidak boleh di masa depan }
                tmt_pensiun: { type: string, format: date, example: "2027-04-01" }
                sk: { type: string, format: binary, description: Hasil pindai SK (PDF/JPG/PNG, maks 10 MB) }
      responses:
        "200":
          description: SK tersimpan, pengajuan selesai
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PensiunPengajuan" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # fragmen: kenaikan_pangkat
  /api/kenaikan-pangkat:
    get:
      tags: [Kenaikan Pangkat]
      summary: Daftar usulan kenaikan pangkat (antrean Sudin Q3 / beranda sekolah K1, K6)
      description: |
        Staf Sudin dan Pimpinan melihat sekolah di wilayahnya; Operator hanya sekolahnya.
        Item daftar tidak memuat `berkas` dan `riwayat`, hanya `jumlah_berkas` dan `berkas_tidak_valid`.
        Antrean "Kirim usulan ke BKD" (K4) = `status=terverifikasi&periode=2027-04`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          description: Satu atau beberapa status dipisah koma
          schema: { type: string, example: "diajukan,perlu_perbaikan" }
        - name: periode
          in: query
          description: Periode KP (YYYY-MM, April atau Oktober)
          schema: { type: string, example: "2027-04" }
        - name: sekolah_id
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Nomor registrasi, nama guru, atau awalan NIP
          schema: { type: string }
      responses:
        "200":
          description: Daftar usulan, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/KenaikanPangkatPengajuan" }
    post:
      tags: [Kenaikan Pangkat]
      summary: Ajukan kenaikan pangkat guru (K2)
      description: |
        Hanya `operator_sekolah`, untuk pendidik PNS di sekolahnya yang golongannya dikenal dan belum IV/e,
        dan tidak sedang punya usulan yang belum selesai. Golongan/pangkat baru = satu tingkat di atas golongan
        di data induk; periode dihitung otomatis. `berkas` memetakan **ke-6 kode** dari
        `GET /api/kenaikan-pangkat/persyaratan` ke id dokumen hasil `POST /api/kenaikan-pangkat/berkas`.
        Staf Sudin di wilayah sekolah mendapat notifikasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pendidik_id, berkas]
              properties:
                pendidik_id: { type: string, format: uuid }
                berkas:
                  type: object
                  description: Kode jenis berkas → id dokumen (6 entri)
                  additionalProperties: { type: string, format: uuid }
                  example: { sk_pangkat_terakhir: 5c2f6a8e-0000-0000-0000-000000000000, pak: 6d3f6a8e-0000-0000-0000-000000000000 }
      responses:
        "201":
          description: Usulan terkirim, status `diajukan`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/KenaikanPangkatPengajuan" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/kenaikan-pangkat/persyaratan:
    get:
      tags: [Kenaikan Pangkat]
      summary: Daftar 6 berkas persyaratan kenaikan pangkat (K2)
      responses:
        "200":
          description: Kode, label, dan kelompok berkas, urut seperti di layar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/KenaikanPangkatJenisBerkas" }

  /api/kenaikan-pangkat/perkiraan:
    get:
      tags: [Kenaikan Pangkat]
      summary: Usulan golongan dan periode sebelum mengajukan (K2 "Cari data")
      description: |
        Pendidik harus dalam scope akun. `kendala` kosong berarti pendidik bisa diusulkan.
        Syarat 4 tahun di golongan sekarang dicek terhadap tanggal periode bila `tmt_golongan` terisi di data induk;
        bila kosong, syarat itu tidak dicek. `POST /api/kenaikan-pangkat` menolak (400) dengan alasan yang sama.
      parameters:
        - name: pendidik_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Perkiraan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/KenaikanPangkatPerkiraan" }
        "404": { $ref: "#/components/responses/Error" }

  /api/kenaikan-pangkat/memenuhi-syarat:
    get:
      tags: [Kenaikan Pangkat]
      summary: Guru yang memenuhi syarat pada periode berikut (K1)
      description: |
        PNS dalam scope akun yang sudah 4 tahun atau lebih di golongannya pada tanggal periode berikut, belum di golongan
        tertinggi, dan tidak punya usulan yang masih berjalan. Guru tanpa `tmt_golongan` tidak muncul. Maksimal 500 baris,
        urut TMT terlama dulu.
      responses:
        "200":
          description: Daftar guru
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            pendidik: { $ref: "#/components/schemas/KenaikanPangkatPendidik" }
                            sekolah:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                npsn: { type: string }
                                nama: { type: string }
                            periode: { type: string, example: "2027-04" }
                            golongan_lama: { type: string, example: III/b }
                            golongan_baru: { type: string, example: III/c }
                            pangkat_baru: { type: string, example: Penata }
                            tmt_golongan: { type: string, format: date, example: "2023-04-01" }
                            masa_kerja_golongan: { $ref: "#/components/schemas/MasaKerjaGolongan" }

  /api/kenaikan-pangkat/berkas:
    post:
      tags: [Kenaikan Pangkat]
      summary: Unggah satu berkas persyaratan (K2)
      description: |
        Hanya `operator_sekolah`. PDF, maks 2 MB ("Format harus PDF"). Berkas belum terikat usulan sampai dirujuk di
        `POST /api/kenaikan-pangkat` atau `POST /api/kenaikan-pangkat/{id}/perbaikan`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas]
              properties:
                berkas: { type: string, format: binary }
      responses:
        "201":
          description: Berkas tersimpan; pakai `data.id` di pengajuan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Dokumen" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/kenaikan-pangkat/ringkasan:
    get:
      tags: [Kenaikan Pangkat]
      summary: Jumlah usulan per status (kartu antrean Q3)
      responses:
        "200":
          description: Jumlah per status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: { type: integer }
                        example: { diajukan: 3, perlu_perbaikan: 1, terverifikasi: 3, diusulkan_ke_bkd: 1, selesai: 0 }

  /api/kenaikan-pangkat/kirim-bkd:
    post:
      tags: [Kenaikan Pangkat]
      summary: Catat pengiriman beberapa usulan ke BKD (K4)
      description: |
        Hanya `staf_sudin`. Semua `ids` harus dalam wilayahnya (404 bila tidak) dan berstatus `terverifikasi`
        (409 bila tidak); jika satu gagal, tidak ada yang tersimpan. Status menjadi `diusulkan_ke_bkd`.
        Bukti disimpan satu salinan per sekolah supaya operator tiap sekolah bisa mengunduhnya.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ids, nomor_surat_pengantar, tanggal_kirim]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Kirim field `ids` berulang, satu per usulan
                  items: { type: string, format: uuid }
                nomor_surat_pengantar: { type: string, maxLength: 100, example: 0045/KP.02.03/2027 }
                tanggal_kirim: { type: string, format: date, example: "2027-02-20", description: Tidak boleh di masa depan }
                cara_kirim: { type: string, maxLength: 100 }
                catatan: { type: string, maxLength: 1000 }
                bukti: { type: string, format: binary, description: Opsional, tanda terima BKD (PDF/JPG/PNG) }
      responses:
        "200":
          description: Pengiriman tercatat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          diusulkan:
                            type: array
                            items: { type: string, example: KP-2026-0118 }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/kenaikan-pangkat/{id}:
    get:
      tags: [Kenaikan Pangkat]
      summary: Detail usulan beserta berkas dan riwayat status
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/KenaikanPangkatPengajuan" }
        "404": { $ref: "#/components/responses/Error" }

  /api/kenaikan-pangkat/{id}/perbaikan:
    post:
      tags: [Kenaikan Pangkat]
      summary: Unggah ulang berkas yang tidak valid (operator, K6)
      description: |
        Hanya saat status `perlu_perbaikan`. `berkas` harus berisi persis semua berkas yang dinyatakan tidak valid.
        Berkas pengganti kembali "belum dinilai"; status kembali ke `diajukan`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [berkas]
              properties:
                berkas:
                  type: object
                  additionalProperties: { type: string, format: uuid }
                  example: { skp_2_tahun: 5c2f6a8e-0000-0000-0000-000000000000, pak: 6d3f6a8e-0000-0000-0000-000000000000 }
      responses:
        "200":
          description: Perbaikan terkirim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/KenaikanPangkatPengajuan" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/kenaikan-pangkat/{id}/verifikasi:
    post:
      tags: [Kenaikan Pangkat]
      summary: Verifikasi berkas per jenis (K3)
      description: |
        Hanya `staf_sudin`, saat status `diajukan`. Aturan sama dengan Pensiun: penilaian sebagian boleh,
        tetapi setelah digabung semua berkas wajib sudah dinilai; tidak valid wajib punya `catatan`.
        Semua valid → `terverifikasi`; ada yang tidak valid → `perlu_perbaikan`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [penilaian]
              properties:
                penilaian:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items: { $ref: "#/components/schemas/KenaikanPangkatPenilaian" }
      responses:
        "200":
          description: Penilaian tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/KenaikanPangkatPengajuan" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/kenaikan-pangkat/{id}/sk:
    post:
      tags: [Kenaikan Pangkat]
      summary: Unggah SK dan perbarui pangkat (K5)
      description: |
        Hanya `staf_sudin`, saat status `diusulkan_ke_bkd`. Dalam satu transaksi: SK diarsipkan, `pangkat` dan
        `golongan` pendidik di data induk diganti dengan usulan baru, status menjadi `selesai` (final), dan operator
        diberi tahu. 409 bila golongan di data induk sudah berubah dari golongan lama usulan (dan bukan golongan baru).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nomor_sk, tanggal_sk, tmt_pangkat, sk]
              properties:
                nomor_sk: { type: string, maxLength: 100, example: KP.1342/BKD/III/2027 }
                tanggal_sk: { type: string, format: date, example: "2027-03-25", description: Tidak boleh di masa depan }
                tmt_pangkat: { type: string, format: date, example: "2027-04-01" }
                sk: { type: string, format: binary, description: Dokumen SK (PDF/JPG/PNG, maks 10 MB) }
      responses:
        "200":
          description: SK tersimpan, pangkat diperbarui, usulan selesai
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/KenaikanPangkatPengajuan" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # fragmen: disiplin
  /api/disiplin:
    get:
      tags: [Sikap Disiplin]
      summary: Daftar kasus (rekap DS9 / status sekolah / antrean pimpinan)
      description: |
        Staf Sudin dan pimpinan melihat sekolah di wilayahnya; operator hanya sekolahnya. Daftar hanya memuat ringkasan;
        untuk `pimpinan` tanpa identitas guru (Figma B1). Tab DS9: Perlu tindakan = `status=registrasi,pemeriksaan,sanksi_ditetapkan`,
        Berjalan = `status=perlu_kelengkapan,menunggu_keputusan,tindak_lanjut`, Selesai = `status=selesai,tidak_dilanjutkan`.
        Antrean pimpinan ("Keputusan menunggu") = `status=menunggu_keputusan`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          description: Satu atau beberapa status dipisah koma
          schema: { type: string, example: "registrasi,pemeriksaan" }
        - name: sekolah_id
          in: query
          schema: { type: string, format: uuid }
        - name: tahun
          in: query
          description: Tahun laporan masuk
          schema: { type: integer, example: 2026 }
        - name: search
          in: query
          description: Nomor kasus, nama guru, atau awalan NIP
          schema: { type: string }
      responses:
        "200":
          description: Daftar kasus, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DisiplinKasus" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [Sikap Disiplin]
      summary: Laporkan dugaan pelanggaran (DS1, operator)
      description: |
        Hanya `operator_sekolah`, untuk pendidik ASN (PNS/PPPK) di sekolahnya. Status awal `registrasi`,
        tenggat verifikasi 5 hari kerja. Staf Sudin wilayah sekolah mendapat notifikasi (tanpa nama pegawai).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pendidik_id, jenis_pelanggaran, uraian, kronologi, pernyataan, bukti_awal]
              properties:
                pendidik_id: { type: string, format: uuid }
                jenis_pelanggaran: { $ref: "#/components/schemas/DisiplinJenisPelanggaran" }
                uraian: { type: string, maxLength: 5000, description: Fakta yang tercatat, bukan kesimpulan }
                kronologi:
                  type: string
                  description: JSON array 1-30 baris; tanggal tidak di masa depan; kejadian maks 500 karakter
                  example: '[{"tanggal":"2026-03-13","kejadian":"Tidak hadir tanpa keterangan 3 hari kerja"}]'
                pernyataan: { type: boolean, description: "Harus `true` (laporan disusun berdasarkan data yang benar)" }
                bukti_awal: { type: string, format: binary, description: PDF/JPG/PNG maks 10 MB }
                bukti_pendukung:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Laporan terkirim, status `registrasi`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinKasus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/disiplin/ringkasan:
    get:
      tags: [Sikap Disiplin]
      summary: Kartu rekap kasus (DS9) dan jumlah per status (B2)
      responses:
        "200":
          description: Ringkasan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinRingkasan" }

  /api/disiplin/{id}:
    get:
      tags: [Sikap Disiplin]
      summary: Detail kasus beserta riwayat status (isi disaring per peran)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinKasus" }
        "404": { $ref: "#/components/responses/Error" }

  /api/disiplin/{id}/dokumen/{dokumen_id}:
    get:
      tags: [Sikap Disiplin]
      summary: Unduh berkas kasus
      description: |
        Berkas harus milik kasus dan kasus dalam scope pembaca. Operator sekolah tidak bisa mengunduh berkas internal
        (`bap`, `tanggapan_pegawai`, `bukti_tambahan`, `bukti_penyampaian`) dan mendapat 404. Berkas internal juga tidak
        tersedia lewat `/api/dokumen/{id}` (disimpan tanpa `sekolah_id`). `?inline=1` untuk pratinjau.
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: dokumen_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: inline
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Isi berkas
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }

  /api/disiplin/{id}/verifikasi:
    post:
      tags: [Sikap Disiplin]
      summary: Verifikasi awal kasus (DS2, staf Sudin)
      description: |
        Hanya saat `registrasi`. `layak` → `pemeriksaan` (semua butir daftar periksa harus `true`, tenggat 20 hari kerja);
        `perlu_kelengkapan` → `perlu_kelengkapan` (`catatan` = daftar kekurangan, wajib; `batas_kelengkapan` default 10 hari kerja);
        `tidak_layak` → `tidak_dilanjutkan` (final; `catatan` = alasan, wajib). Operator sekolah mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keputusan, identitas_sesuai, kronologi_jelas, bukti_memadai, dalam_kewenangan]
              properties:
                keputusan: { type: string, enum: [layak, perlu_kelengkapan, tidak_layak] }
                identitas_sesuai: { type: boolean }
                kronologi_jelas: { type: boolean }
                bukti_memadai: { type: boolean }
                dalam_kewenangan: { type: boolean }
                catatan: { type: string, maxLength: 2000, example: "1. Rekap presensi bertanda tangan Kepala Sekolah. 2. Notula pembinaan lisan 10 Juni 2026." }
                batas_kelengkapan: { type: string, format: date, example: "2026-10-22" }
      responses:
        "200":
          description: Verifikasi tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinKasus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/disiplin/{id}/kelengkapan:
    post:
      tags: [Sikap Disiplin]
      summary: Lengkapi laporan (DS3, operator)
      description: |
        Hanya saat `perlu_kelengkapan`. Status kembali ke `registrasi` untuk verifikasi ulang; staf Sudin mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tanggapan, berkas]
              properties:
                tanggapan: { type: string, maxLength: 2000 }
                berkas:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Kelengkapan terkirim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinKasus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/disiplin/{id}/pemeriksaan:
    post:
      tags: [Sikap Disiplin]
      summary: Catat pemanggilan dan hasil pemeriksaan (DS4, staf Sudin)
      description: |
        Hanya saat `pemeriksaan`; boleh disimpan berulang (status tidak berubah, berkas yang dikirim ditambahkan).
        Pemanggilan dan BAP dilakukan di luar sistem. `waktu_pemeriksaan` dalam WIB.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nomor_surat_panggilan, waktu_pemeriksaan]
              properties:
                nomor_surat_panggilan: { type: string, maxLength: 100, example: e-0412/KP.03.02 }
                waktu_pemeriksaan: { type: string, example: "2026-10-29T09:00", description: "Format YYYY-MM-DDTHH:MM (WIB)" }
                ringkasan_pemeriksaan: { type: string, maxLength: 5000 }
                bap: { type: string, format: binary, description: BAP bertanda tangan }
                tanggapan_pegawai: { type: string, format: binary, description: Tanggapan tertulis pegawai }
                bukti_tambahan: { type: string, format: binary }
      responses:
        "200":
          description: Hasil pemeriksaan tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinKasus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/disiplin/{id}/rekomendasi:
    post:
      tags: [Sikap Disiplin]
      summary: Ajukan rekomendasi hukuman ke pimpinan (DS5, staf Sudin)
      description: |
        Hanya saat `pemeriksaan`, setelah ringkasan pemeriksaan, BAP, dan tanggapan tertulis pegawai ada (400 bila belum).
        `jenis_hukuman` harus sesuai `tingkat`. Status → `menunggu_keputusan`, tenggat 5 hari kerja; pimpinan mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ringkasan_fakta, dugaan_terbukti, dasar_hukum, tingkat, jenis_hukuman, justifikasi]
              properties:
                ringkasan_fakta: { type: string, maxLength: 5000 }
                dugaan_terbukti: { type: string, maxLength: 500, example: Tidak hadir tanpa keterangan 10 hari kerja (2026) }
                dasar_hukum: { type: string, maxLength: 500, example: PP 94/2021 tentang Disiplin PNS - ketentuan kehadiran }
                tingkat: { $ref: "#/components/schemas/DisiplinTingkat" }
                jenis_hukuman: { $ref: "#/components/schemas/DisiplinJenisHukuman" }
                justifikasi: { type: string, maxLength: 5000 }
      responses:
        "200":
          description: Rekomendasi diajukan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinKasus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/disiplin/{id}/keputusan:
    post:
      tags: [Sikap Disiplin]
      summary: Tetapkan keputusan hukuman (DS6, hanya pimpinan)
      description: |
        Hanya `pimpinan` Sudin wilayah sekolah, saat `menunggu_keputusan`. `setujui` → `sanksi_ditetapkan` dengan hukuman
        rekomendasi; `ubah` → `sanksi_ditetapkan` dengan `tingkat` + `jenis_hukuman` baru (`catatan` wajib);
        `kembalikan` → `pemeriksaan` untuk telaah (`catatan` wajib). Keputusan tidak dapat dibatalkan.
        Staf Sudin dan sekolah diberi tahu.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keputusan]
              properties:
                keputusan: { type: string, enum: [setujui, ubah, kembalikan] }
                tingkat: { $ref: "#/components/schemas/DisiplinTingkat" }
                jenis_hukuman: { $ref: "#/components/schemas/DisiplinJenisHukuman" }
                catatan: { type: string, maxLength: 2000, example: Setuju. Agar keputusan disampaikan langsung kepada pegawai disertai pembinaan oleh Kepala Sekolah. }
      responses:
        "200":
          description: Keputusan tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinKasus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/disiplin/{id}/catat-keputusan:
    post:
      tags: [Sikap Disiplin]
      summary: Catat keputusan final (DS7, staf Sudin)
      description: |
        Hanya saat `sanksi_ditetapkan`. `masa_mulai` wajib untuk hukuman bermasa; `masa_selesai` dihitung otomatis
        (mis. 6 bulan dari 1 Des 2026 sampai 31 Mei 2027). Status → `tindak_lanjut`; sekolah diminta laporan pelaksanaan dalam 7 hari kerja.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nomor_keputusan, tanggal_keputusan, salinan_keputusan]
              properties:
                nomor_keputusan: { type: string, maxLength: 100, example: e-0587/KP.04.01 }
                tanggal_keputusan: { type: string, format: date, example: "2026-11-10" }
                masa_mulai: { type: string, format: date, example: "2026-12-01" }
                salinan_keputusan: { type: string, format: binary }
      responses:
        "200":
          description: Keputusan final tercatat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinKasus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/disiplin/{id}/tindak-lanjut:
    post:
      tags: [Sikap Disiplin]
      summary: Perbarui tindak lanjut (DS7, staf Sudin)
      description: |
        Hanya saat `tindak_lanjut`; status tidak berubah, field kosong tidak mengubah data.
        `dicatat_idis=true` hanya untuk PNS (pencatatan di I'DIS BKN dilakukan di luar sistem).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                tanggal_diterima_pegawai: { type: string, format: date }
                bukti_penyampaian: { type: string, format: binary }
                dicatat_idis: { type: boolean }
                upaya_administratif: { type: string, enum: [tidak_ada, ada] }
                catatan_upaya: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Tindak lanjut tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinKasus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/disiplin/{id}/laporan-pelaksanaan:
    post:
      tags: [Sikap Disiplin]
      summary: Kirim laporan pelaksanaan hukuman (DS8, operator)
      description: |
        Hanya saat `tindak_lanjut`; status tidak berubah. Staf Sudin mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [catatan, berkas]
              properties:
                catatan: { type: string, maxLength: 2000 }
                berkas: { type: string, format: binary }
      responses:
        "200":
          description: Laporan pelaksanaan terkirim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinKasus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/disiplin/{id}/tutup:
    post:
      tags: [Sikap Disiplin]
      summary: Tutup kasus (DS7, staf Sudin)
      description: |
        Hanya saat `tindak_lanjut`. Syarat (409 bila belum): bukti penyampaian, laporan pelaksanaan sekolah, upaya administratif
        diisi (bila `ada`, catatan wajib), dan untuk PNS sudah dicatat di I'DIS. Status → `selesai` (final).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                catatan: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Kasus ditutup
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DisiplinKasus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # fragmen: surat
  /api/surat/jenis:
    get:
      tags: [Generator Surat]
      summary: Daftar jenis surat (S1)
      description: Template surat didefinisikan di kode. Bisa dibaca `staf_sudin`, `admin`, `pimpinan`.
      responses:
        "200":
          description: Jenis surat sesuai urutan kartu S1
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SuratJenisItem" }
        "403": { $ref: "#/components/responses/Error" }

  /api/surat:
    get:
      tags: [Generator Surat]
      summary: Daftar surat (Surat terakhir di S1, antrean Menunggu TTD di S4)
      description: |
        Staf Sudin dan Pimpinan melihat surat untuk pendidik di sekolah wilayahnya; Admin semua.
        S4 "Surat lain yang menunggu tanda tangan" = `status=menunggu_ttd`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          description: Satu atau beberapa status dipisah koma
          schema: { type: string, example: "draf,menunggu_ttd" }
        - name: jenis
          in: query
          schema: { $ref: "#/components/schemas/JenisSurat" }
        - name: pendidik_id
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Nomor surat, perihal, nama guru, atau awalan NIP
          schema: { type: string }
      responses:
        "200":
          description: Daftar surat, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Surat" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Generator Surat]
      summary: Simpan draf surat (S2)
      description: |
        `staf_sudin` (pendidik di wilayah Sudin-nya) atau `admin`. Data guru diambil dari master pendidik.
        Nomor kosong = nomor urut otomatis; nomor isian dicek unik.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuratBuatRequest" }
      responses:
        "201":
          description: Draf tersimpan, status `draf`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Surat" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/surat/{id}:
    get:
      tags: [Generator Surat]
      summary: Detail surat beserta riwayat status
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Surat" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Generator Surat]
      summary: Ubah isian surat (S3 > Ubah isian)
      description: Hanya saat status `draf`. Jenis dan pendidik tidak bisa diganti. Nomor kosong = nomor tetap.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuratIsian" }
      responses:
        "200":
          description: Isian tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Surat" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/surat/{id}/pratinjau:
    get:
      tags: [Generator Surat]
      summary: Pratinjau PDF surat (S3)
      description: |
        Merender PDF dari isian dan data pendidik saat ini tanpa menyimpannya. Bisa untuk status apa pun;
        PDF resmi yang dicetak adalah `dokumen` yang disimpan saat buat dokumen.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: "Berkas PDF (`Content-Disposition: inline`)"
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/surat/{id}/buat-dokumen:
    post:
      tags: [Generator Surat]
      summary: Simpan & buat dokumen (S3)
      description: |
        Hanya dari `draf`. PDF dibuat lalu disimpan sebagai dokumen; status menjadi `menunggu_ttd`.
        Staf Sudin di wilayah sekolah mendapat notifikasi untuk mengunggah pindaian setelah ditandatangani.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Status `menunggu_ttd`, `dokumen` berisi PDF untuk dicetak
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Surat" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/surat/{id}/final:
    post:
      tags: [Generator Surat]
      summary: Unggah hasil pindai & tetapkan Final (S4)
      description: |
        Hanya dari `menunggu_ttd`. Hasil pindai wajib PDF, maks 5 MB. Status menjadi `final` dan terkunci.
        Operator sekolah pendidik mendapat notifikasi dan bisa mengunduh hasil pindai.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas]
              properties:
                berkas:
                  type: string
                  format: binary
                  description: Hasil pindai surat bertanda tangan (PDF, maks 5 MB)
      responses:
        "200":
          description: Status `final`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Surat" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/surat/{id}/batal:
    post:
      tags: [Generator Surat]
      summary: Batalkan surat yang belum final
      description: Dari `draf` atau `menunggu_ttd`. Status menjadi `dibatalkan`; nomor surat tidak dipakai ulang.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan: { type: string, maxLength: 1000, example: Pejabat meminta revisi isi surat }
      responses:
        "200":
          description: Status `dibatalkan`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Surat" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/surat/{id}/serahkan:
    post:
      tags: [Generator Surat]
      summary: Tandai surat asli sudah diserahkan (S5)
      description: Hanya untuk surat `final`, sekali saja. Status tetap `final`; `diserahkan_at` terisi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Penyerahan tercatat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Surat" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # fragmen: anjab
  /api/anjab/periode:
    get:
      tags: [Analisis Jabatan]
      summary: Daftar periode Anjab
      description: Staf Sudin dan Pimpinan melihat periode Sudin-nya; Operator melihat periode Sudin sekolahnya; Admin semua.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Daftar periode, tahun ajaran terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AnjabPeriode" }
    post:
      tags: [Analisis Jabatan]
      summary: Buat periode & parameter perhitungan (A1)
      description: |
        Hanya `staf_sudin`; periode dimiliki Sudin akun yang login. Satu periode per tahun ajaran per Sudin.
        Beban JP divalidasi: jenjang termasuk periode, tingkat sesuai jenjang, tanpa duplikat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnjabPeriodeRequest" }
      responses:
        "201":
          description: Periode tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabPeriode" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/anjab/periode/{id}:
    get:
      tags: [Analisis Jabatan]
      summary: Detail periode beserta beban JP dan progres per status
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabPeriode" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Analisis Jabatan]
      summary: Ubah periode & parameter (A1)
      description: Semua kolom dikirim ulang; beban JP diganti seluruhnya. Ditolak 409 setelah masa pembaruan dibuka.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnjabPeriodeRequest" }
      responses:
        "200":
          description: Parameter tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabPeriode" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/anjab/periode/{id}/templat:
    get:
      tags: [Analisis Jabatan]
      summary: Unduh templat spreadsheet master (A2)
      description: Lembar Sekolah, Rombel, Guru (header saja; kolom NPSN/NIP/NIK berformat teks) dan lembar Petunjuk.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }

  /api/anjab/periode/{id}/impor:
    post:
      tags: [Analisis Jabatan]
      summary: Impor spreadsheet master (A2)
      description: |
        Hanya sebelum masa pembaruan dibuka (409 sesudahnya). Tanpa `simpan` (atau `simpan=false`) hanya memvalidasi
        dan mengembalikan daftar galat per baris. Dengan `simpan=true` baris valid disimpan:
        sekolah terdaftar sebagai peserta (draf); rombel dan daftar guru sekolah yang ada di berkas menggantikan data
        sebelumnya; guru di-upsert ke tabel pendidik berdasar NIP (tanpa NIP: nama di sekolah yang sama).
        Kolom Guru: NPSN, NIP, NIK, Nama, Status Kepegawaian, Golongan, Tanggal Lahir, TMT CPNS, Mapel SK, Mapel Riil, JP Riil.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas]
              properties:
                berkas: { type: string, format: binary, description: ".xlsx dari templat, maks 10 MB" }
                simpan: { type: boolean, default: false }
      responses:
        "200":
          description: Hasil validasi (dan penyimpanan bila `simpan=true`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabImporHasil" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/anjab/periode/{id}/buka:
    post:
      tags: [Analisis Jabatan]
      summary: Buka masa pembaruan (A3)
      description: |
        Mengunci parameter, mendaftarkan semua sekolah Sudin dengan jenjang periode sebagai `draf`,
        dan mengirim notifikasi ke operator sekolah. Butuh minimal satu beban JP. Sekali saja (409 bila sudah dibuka).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Masa pembaruan dibuka
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabPeriode" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/anjab/periode/{id}/tenggat:
    put:
      tags: [Analisis Jabatan]
      summary: Perpanjang tenggat pembaruan (A3)
      description: Hanya setelah dibuka; tanggal baru harus setelah tenggat lama. Sekolah yang belum mengirim mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tanggal_tutup]
              properties:
                tanggal_tutup: { type: string, format: date, example: "2026-12-12" }
      responses:
        "200":
          description: Tenggat diperpanjang
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabPeriode" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/anjab/periode/{id}/pengingat:
    post:
      tags: [Analisis Jabatan]
      summary: Kirim pengingat ke sekolah yang belum mengirim (A3)
      description: Notifikasi ke operator sekolah berstatus `draf` atau `dikembalikan`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Pengingat terkirim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          jumlah_sekolah: { type: integer, example: 24 }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/anjab/periode/{id}/monitoring:
    get:
      tags: [Analisis Jabatan]
      summary: Monitoring & rekomendasi pemerataan (A6)
      description: |
        Staf Sudin, Pimpinan, Admin. Memakai hasil versi kondisi riil sekolah yang sudah `ditetapkan`.
        Rekomendasi memasangkan sekolah kelebihan dengan sekolah kekurangan per mapel (kecamatan sama diutamakan).
        Mutasi tetap diproses di luar sistem.
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: mapel
          in: query
          description: Saring rekomendasi untuk satu mapel (tidak peka huruf besar/kecil)
          schema: { type: string, example: IPA }
      responses:
        "200":
          description: Ringkasan periode dan rekomendasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabMonitoring" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/anjab/periode/{id}/monitoring/excel:
    get:
      tags: [Analisis Jabatan]
      summary: Unduh rekap monitoring (A6, Excel)
      description: Lembar "Rekap Sekolah" dan "Rekomendasi".
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Berkas .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/anjab/periode/{id}/monitoring/pdf:
    get:
      tags: [Analisis Jabatan]
      summary: Unduh laporan Anjab (A6, PDF)
      description: Ringkasan periode, rekap per sekolah, dan rekomendasi pemerataan guru; angkanya sama dengan monitoring.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Berkas PDF
          content:
            application/pdf: { schema: { type: string, format: binary } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/anjab/sekolah:
    get:
      tags: [Analisis Jabatan]
      summary: Daftar data Anjab per sekolah (A3 pantau / A4 milik operator)
      description: Operator hanya melihat sekolahnya; Staf Sudin dan Pimpinan sekolah di wilayahnya.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: periode_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Satu atau beberapa status dipisah koma
          schema: { type: string, example: "draf,dikembalikan" }
        - name: kecamatan
          in: query
          schema: { type: string, example: Kebon Jeruk }
        - name: search
          in: query
          description: Nama sekolah atau awalan NPSN
          schema: { type: string }
      responses:
        "200":
          description: Daftar, urut nama sekolah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AnjabSekolah" }

  /api/anjab/sekolah/{id}:
    get:
      tags: [Analisis Jabatan]
      summary: Detail data Anjab sekolah dengan hasil hitungan dua versi (A4/A5)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabSekolah" }
        "404": { $ref: "#/components/responses/Error" }

  /api/anjab/sekolah/{id}/rombel:
    put:
      tags: [Analisis Jabatan]
      summary: Perbarui rombongan belajar (A4, operator)
      description: |
        Mengganti seluruh data rombel. Hanya saat masa pembaruan terbuka, belum lewat tenggat,
        dan status `draf` atau `dikembalikan` (409 selain itu). Tingkat sesuai jenjang sekolah.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rombel]
              properties:
                rombel:
                  type: array
                  minItems: 1
                  maxItems: 12
                  items:
                    type: object
                    required: [tingkat]
                    properties:
                      tingkat: { type: integer, example: 7 }
                      jumlah_rombel: { type: integer, minimum: 0, maximum: 200, example: 9 }
                      jumlah_siswa: { type: integer, minimum: 0, maximum: 20000, example: 288 }
      responses:
        "200":
          description: Rombel tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabSekolah" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/anjab/sekolah/{id}/guru:
    post:
      tags: [Analisis Jabatan]
      summary: Tambah guru ke daftar (A4, operator)
      description: Pendidik harus terdaftar di sekolah tersebut. Aturan waktu dan status sama dengan ubah rombel.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pendidik_id, mapel_sk]
              properties:
                pendidik_id: { type: string, format: uuid }
                mapel_sk: { type: string, maxLength: 100, example: Bahasa Indonesia }
                mapel_riil: { type: string, maxLength: 100, example: Prakarya }
                jp_riil: { type: integer, minimum: 0, maximum: 60, example: 24 }
      responses:
        "201":
          description: Guru ditambahkan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabSekolah" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/anjab/sekolah/{id}/guru/{guruId}:
    put:
      tags: [Analisis Jabatan]
      summary: Ubah mapel riil dan JP riil guru (A4, operator)
      description: Mapel SK tidak diubah operator; perubahan SK lewat Sudin (impor).
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: guruId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mapel_riil]
              properties:
                mapel_riil: { type: string, maxLength: 100, example: Prakarya }
                jp_riil: { type: integer, minimum: 0, maximum: 60, example: 24 }
      responses:
        "200":
          description: Data guru tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabSekolah" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Analisis Jabatan]
      summary: Keluarkan guru dari daftar Anjab sekolah (A4, operator)
      description: Data pendidik tidak dihapus, hanya baris Anjab periode ini.
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: guruId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Guru dihapus dari daftar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabSekolah" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/anjab/sekolah/{id}/kirim:
    post:
      tags: [Analisis Jabatan]
      summary: Kirim pembaruan ke Sudin (A4, operator)
      description: |
        Dari `draf` atau `dikembalikan` → `dikirim`, `kiriman_ke` bertambah. Syarat: ada rombel, ada guru,
        dan semua guru yang dihitung sudah punya mapel riil (400). Staf Sudin mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Pembaruan terkirim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabSekolah" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/anjab/sekolah/{id}/tinjau:
    post:
      tags: [Analisis Jabatan]
      summary: Tetapkan atau kembalikan hasil Anjab sekolah (A5, staf Sudin)
      description: |
        Hanya saat status `dikirim`. `ditetapkan` final: hasil hitungan dibekukan dan sekolah tidak dapat mengubahnya lagi.
        `dikembalikan` wajib disertai `catatan`. Operator sekolah mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keputusan]
              properties:
                keputusan: { type: string, enum: [ditetapkan, dikembalikan] }
                catatan:
                  type: string
                  maxLength: 2000
                  example: Sesuaikan mapel riil Dewi Anggraini dan jumlah siswa kelas IX (Dapodik 281).
      responses:
        "200":
          description: Hasil tinjauan tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnjabSekolah" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # fragmen: dapodik
  /api/dapodik:
    get:
      tags: [Layanan Dapodik]
      summary: Daftar tiket Dapodik (antrean Sudin DP3 / tiket saya DP1)
      description: |
        Staf Sudin dan Pimpinan melihat sekolah di wilayahnya; Operator hanya sekolahnya.
        Tab DP3: Baru = `status=baru`, Perlu Info Tambahan = `status=perlu_info_tambahan`, Selesai = `status=selesai`.
        Antrean DP3 diurutkan menurut tenggat dengan `urut=tenggat`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          description: Satu atau beberapa status dipisah koma
          schema: { type: string, example: "baru,perlu_info_tambahan" }
        - name: jenis
          in: query
          schema: { $ref: "#/components/schemas/DapodikJenis" }
        - name: sekolah_id
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Nomor tiket atau nama sekolah
          schema: { type: string }
        - name: urut
          in: query
          description: "`tenggat` = tenggat terdekat dulu; default terbaru dulu"
          schema: { type: string, enum: [tenggat] }
      responses:
        "200":
          description: Daftar tiket
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DapodikTiket" }
    post:
      tags: [Layanan Dapodik]
      summary: Kirim tiket layanan Dapodik (DP1 + DP2)
      description: |
        Hanya `operator_sekolah`; tiket selalu milik sekolah operator. Field `isian` berupa string JSON objek
        berisi field formulir per jenis (kunci huruf kecil/angka/garis bawah, maks 20 field, nilai maks 1000 karakter).

        Aturan per jenis:
        - `revisi_akun_operator`: isian wajib `nama_operator_lama`, `nama_operator_baru`, `nik_operator_baru` (16 digit),
          `email_operator_baru`; minimal 2 lampiran (SK penunjukan operator, surat permohonan).
        - `perbaikan_data_ptk`: `pendidik_id` (PTK di sekolah operator) dan isian `data_diperbaiki` wajib.
        - Jenis lain: hanya `uraian` wajib.

        Tenggat = 3 hari kerja sejak tiket masuk. Staf Sudin di wilayah sekolah mendapat notifikasi.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [jenis, uraian]
              properties:
                jenis: { $ref: "#/components/schemas/DapodikJenis" }
                pendidik_id: { type: string, format: uuid, description: PTK terkait (wajib untuk perbaikan_data_ptk) }
                isian:
                  type: string
                  description: Objek JSON field formulir
                  example: '{"nama_operator_lama":"Dedi Kurniawan","nama_operator_baru":"Rizky Pratama Nugraha, S.Kom.","nik_operator_baru":"3173050101900008","email_operator_baru":"rizky.pratama@example.com"}'
                uraian: { type: string, maxLength: 2000, description: Alasan atau penjelasan permintaan }
                lampiran:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
                  description: PDF/JPG/PNG, maks 10 MB per berkas
      responses:
        "201":
          description: Tiket terkirim, status `baru`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DapodikTiket" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/dapodik/ringkasan:
    get:
      tags: [Layanan Dapodik]
      summary: Jumlah tiket per status (tab DP3)
      responses:
        "200":
          description: Jumlah per status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: { type: integer }
                        example: { baru: 6, perlu_info_tambahan: 1, selesai: 9 }

  /api/dapodik/{id}:
    get:
      tags: [Layanan Dapodik]
      summary: Detail tiket beserta lampiran dan riwayat status (DP4/DP5)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DapodikTiket" }
        "404": { $ref: "#/components/responses/Error" }

  /api/dapodik/{id}/tinjau:
    post:
      tags: [Layanan Dapodik]
      summary: Tinjau tiket (staf Sudin, DP4)
      description: |
        Hanya saat status `baru`. `keputusan=perlu_info_tambahan` → `catatan` dikirim ke sekolah sebagai permintaan info.
        `keputusan=selesai` → `catatan` adalah catatan penyelesaian setelah diproses di aplikasi Dapodik (di luar sistem);
        status final. Operator sekolah mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keputusan, catatan]
              properties:
                keputusan: { type: string, enum: [selesai, perlu_info_tambahan] }
                catatan: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Tinjauan tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DapodikTiket" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/dapodik/{id}/lengkapi:
    post:
      tags: [Layanan Dapodik]
      summary: Lengkapi info tambahan (operator, DP5)
      description: Hanya saat status `perlu_info_tambahan`. Status kembali `baru` dengan tenggat baru 3 hari kerja.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [balasan]
              properties:
                balasan: { type: string, maxLength: 2000, description: Balasan untuk admin }
                lampiran:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
                  description: Dokumen pendukung (opsional)
      responses:
        "200":
          description: Kelengkapan terkirim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DapodikTiket" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # fragmen: kinerja_p3k
  /api/kinerja-p3k:
    get:
      tags: [Kinerja P3K PW]
      summary: Daftar penilaian (antrean Menunggu TTD KP4 / arsip Final KP5)
      description: |
        Staf Sudin dan Pimpinan melihat sekolah di wilayahnya; Operator hanya sekolahnya.
        KP4 = `status=menunggu_ttd`, KP5 = `status=final`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          description: Satu atau beberapa status dipisah koma
          schema: { type: string, example: menunggu_ttd }
        - name: tahun
          in: query
          schema: { type: integer, example: 2026 }
        - name: semester
          in: query
          schema: { type: integer, enum: [1, 2] }
        - name: sekolah_id
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Nomor penilaian atau nama pegawai
          schema: { type: string }
      responses:
        "200":
          description: Daftar penilaian, terbaru diperbarui dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/KinerjaPenilaian" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [Kinerja P3K PW]
      summary: Simpan draf penilaian (KP1 > Nilai, KP2 > Simpan draf)
      description: |
        Hanya `operator_sekolah`, untuk pegawai `PPPK_PW` di sekolahnya. Satu penilaian per pegawai per periode (409 bila sudah ada).
        Nilai boleh belum lengkap; nilai akhir sementara dihitung dari parameter yang terisi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pendidik_id, tahun, semester]
              properties:
                pendidik_id: { type: string, format: uuid }
                tahun: { type: integer, minimum: 2020, maximum: 2100, example: 2026 }
                semester: { type: integer, enum: [1, 2], example: 2 }
                nilai: { $ref: "#/components/schemas/KinerjaNilai" }
      responses:
        "201":
          description: Draf tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/KinerjaPenilaian" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/kinerja-p3k/pegawai:
    get:
      tags: [Kinerja P3K PW]
      summary: Pegawai PPPK PW beserta penilaiannya pada satu periode (KP1)
      parameters:
        - name: tahun
          in: query
          required: true
          schema: { type: integer, example: 2026 }
        - name: semester
          in: query
          required: true
          schema: { type: integer, enum: [1, 2] }
        - name: sekolah_id
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Nama pegawai
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Daftar pegawai urut nama; `penilaian` null bila belum dinilai
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/KinerjaPegawai" }
        "400": { $ref: "#/components/responses/Error" }

  /api/kinerja-p3k/ringkasan:
    get:
      tags: [Kinerja P3K PW]
      summary: Jumlah penilaian per status (Ringkasan periode KP4)
      parameters:
        - name: tahun
          in: query
          schema: { type: integer }
        - name: semester
          in: query
          schema: { type: integer, enum: [1, 2] }
      responses:
        "200":
          description: Jumlah per status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: { type: integer }
                        example: { draf: 61, menunggu_ttd: 4, final: 38 }

  /api/kinerja-p3k/{id}:
    get:
      tags: [Kinerja P3K PW]
      summary: Detail penilaian beserta dokumen dan riwayat status
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/KinerjaPenilaian" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Kinerja P3K PW]
      summary: Ubah nilai draf (KP2 > Simpan draf)
      description: Hanya saat status `draf`. Seluruh nilai diganti; parameter yang tidak dikirim menjadi kosong.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nilai: { $ref: "#/components/schemas/KinerjaNilai" }
      responses:
        "200":
          description: Draf tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/KinerjaPenilaian" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/kinerja-p3k/{id}/dokumen:
    post:
      tags: [Kinerja P3K PW]
      summary: Buat dokumen penilaian PDF (KP2 > Buat dokumen penilaian, KP3)
      description: |
        Hanya saat status `draf` dan ketujuh parameter terisi (400 bila belum). Sistem membuat PDF berisi identitas
        pegawai, periode, tabel nilai per aspek, nilai akhir/predikat, dan ruang tanda tangan; status → `menunggu_ttd`.
        PDF diunduh lewat `dokumen_sistem.url`. Staf Sudin di wilayah sekolah mendapat notifikasi.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Dokumen dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/KinerjaPenilaian" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/kinerja-p3k/{id}/final:
    post:
      tags: [Kinerja P3K PW]
      summary: Unggah dokumen bertanda tangan dan tetapkan Final (staf Sudin, KP4)
      description: |
        Hanya saat status `menunggu_ttd`. Kedua konfirmasi wajib `true`. Status → `final` (tidak bisa diubah);
        operator sekolah mendapat notifikasi dan bisa mengunduh `dokumen_ttd`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [berkas, ttd_jelas, data_sesuai]
              properties:
                berkas: { type: string, format: binary, description: Hasil pindai bertanda tangan (PDF/JPG/PNG, maks 10 MB) }
                ttd_jelas: { type: boolean, description: Tanda tangan dan stempel Pejabat Penilai terlihat jelas }
                data_sesuai: { type: boolean, description: Nama pegawai, periode, dan nilai sama dengan dokumen sistem }
      responses:
        "200":
          description: Ditetapkan Final
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/KinerjaPenilaian" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # fragmen: arsip
  /api/arsip:
    get:
      tags: [Arsip Kepegawaian]
      summary: Daftar arsip (R1, H4)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - { name: pendidik_id, in: query, schema: { type: string, format: uuid } }
        - { name: kategori, in: query, schema: { $ref: "#/components/schemas/ArsipKategori" } }
        - { name: search, in: query, description: "Jenis dokumen, nomor, nama guru, atau awalan NIP", schema: { type: string } }
      responses:
        "200":
          description: Daftar arsip, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Arsip" } }
    post:
      tags: [Arsip Kepegawaian]
      summary: Arsipkan dokumen (R3)
      description: Operator (sekolahnya), staf Sudin, admin. PDF atau JPG, maks. 5 MB per file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pendidik_id, kategori, jenis_dokumen, berkas]
              properties:
                pendidik_id: { type: string, format: uuid }
                kategori: { $ref: "#/components/schemas/ArsipKategori" }
                jenis_dokumen: { type: string, maxLength: 150, example: Surat Keterangan Tunjangan Profesi }
                nomor: { type: string, maxLength: 100 }
                tanggal_dokumen: { type: string, format: date }
                keterangan: { type: string, maxLength: 1000 }
                berkas: { type: string, format: binary }
                lampiran: { type: string, format: binary }
      responses:
        "201":
          description: Dokumen diarsipkan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Arsip" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

