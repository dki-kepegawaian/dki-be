                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ArsipLog" } }
        "403": { $ref: "#/components/responses/Error" }

  /api/arsip/log/ekspor:
    get:
      tags: [Arsip Kepegawaian]
      summary: Ekspor log aktivitas (CSV)
      description: Filter sama dengan daftar log; maks. 10.000 baris.
      responses:
        "200":
          description: Berkas CSV
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Error" }

  /api/arsip/{id}:
    get:
      tags: [Arsip Kepegawaian]
      summary: Detail arsip beserta riwayat versi (R2)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Arsip" }
        "404": { $ref: "#/components/responses/Error" }

  /api/arsip/{id}/unduh:
    get:
      tags: [Arsip Kepegawaian]
      summary: Lihat atau unduh satu versi
      description: "`inline=1` dicatat sebagai melihat; selain itu mengunduh."
