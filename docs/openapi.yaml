        pengaju_nama: { type: string, example: Dedi Kurniawan }
        sekolah:
          type: object
          properties:
            id: { type: string, format: uuid }
            npsn: { type: string }
            nama: { type: string }
            kecamatan: { type: string }
        pendidik:
          type: object
          description: PTK terkait, bila ada
          properties:
