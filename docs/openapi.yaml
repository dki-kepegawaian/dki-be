                kontak_telepon: { type: string, maxLength: 30, example: "(021) 5550 0145" }
                kontak_email: { type: string, format: email }
                jam_layanan: { type: string, maxLength: 100, example: "Senin-Jumat, 08.00-16.00" }
      responses:
        "200":
          description: Sudin setelah diubah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Sudin" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

