                properties:
                  sekolah_id: { type: string, format: uuid }
                  nama: { type: string, example: SMP Negeri 45 Jakarta }
                  kecamatan: { type: string, example: Kebon Jeruk }
                  jumlah: { type: integer, example: 1, description: Kelebihan di sekolah asal }
              ke:
                type: object
                properties:
                  sekolah_id: { type: string, format: uuid }
                  nama: { type: string, example: SMP Negeri 89 Jakarta }
                  kecamatan: { type: string, example: Kalideres }
                  jumlah: { type: integer, example: 2, description: Kekurangan di sekolah tujuan }
              jumlah: { type: integer, example: 1, description: Guru yang disarankan dipindah }
              kecamatan_sama: { type: boolean }
        sekolah:
          type: array
          items:
            type: object
            properties:
              anjab_sekolah_id: { type: string, format: uuid }
              sekolah: { type: object }
              status: { $ref: "#/components/schemas/AnjabStatus" }
              kurang: { type: integer }
              lebih: { type: integer }

